<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papers Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --accent: #36b3ff;
    --accent-dark: #1a8fd6;
    --text: #1c1c1c;
    --muted: #6b7280;
    --border: #dcdde0;
    --page-bg: #ececee;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: #ffffff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header img {
    height: 34px;
    display: block;
  }

  .header-title {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header-subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 400;
  }

  .header-nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .header-nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
  }

  .header-nav a:hover {
    color: var(--accent-dark);
  }

  .page-layout {
    position: relative;
    display: block;
  }

  .main-content {
    width: 100%;
    min-width: 0;
  }

  .filter-sidebar {
    position: static;
  }

  .filter-sidebar .filter-panel {
    margin-bottom: 0;
    position: absolute;
    top: 52px;
    right: 0;
    width: min(360px, calc(100vw - 32px));
    z-index: 50;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
  }

  @media (max-width: 960px) {
    .filter-sidebar .filter-panel {
      position: absolute;
      top: 52px;
      right: 0;
      width: min(360px, calc(100vw - 32px));
    }
  }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }

  #search {
    flex: 1 1 260px;
    padding: 11px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: var(--card-bg);
    transition: border-color 0.15s ease;
  }

  #search:focus {
    border-color: var(--accent);
  }

  .filter-toggle-btn {
    padding: 9px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .filter-toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .filter-toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 260px;
  }

  .search-wrap #search {
    width: 100%;
    padding-left: 40px;
  }

  .search-icon-btn {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-icon-btn:hover {
    color: var(--accent-dark);
  }

  .search-icon-btn svg {
    width: 17px;
    height: 17px;
  }

  .filter-panel {
    display: none;
    flex-direction: column;
    gap: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    position: sticky;
    top: 20px;
  }

  .filter-panel.open {
    display: flex;
  }


  .filter-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .year-range {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .year-range input[type="number"] {
    width: 110px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .year-range input[type="number"]:focus {
    border-color: var(--accent);
  }

  .year-range span {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .multiselect {
    position: relative;
  }

  .multiselect-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .multiselect-chips .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #eaf7ff;
    color: var(--accent-dark);
    font-size: 0.8rem;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
  }

  .multiselect-chips .chip button {
    background: none;
    border: none;
    color: var(--accent-dark);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0 2px;
  }

  .multiselect input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .multiselect input[type="text"]:focus {
    border-color: var(--accent);
  }

  .multiselect-dropdown {
    display: none;
    position: static;
    z-index: 20;
    width: 100%;
    margin-top: 4px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    max-height: 220px;
    overflow-y: auto;
  }

  .multiselect-dropdown.open {
    display: block;
  }

  .multiselect-dropdown .option {
    padding: 8px 12px;
    font-size: 0.87rem;
    cursor: pointer;
  }

  .multiselect-dropdown .option:hover {
    background: #f3f9ff;
  }

  .multiselect-dropdown .no-results {
    padding: 8px 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .clear-filters-btn {
    align-self: flex-start;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
  }

  .clear-filters-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .count {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .page-size-label {
    color: var(--muted);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .page-size-label select {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 4px 8px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 24px;
  }

  .pagination .page-btn {
    padding: 8px 16px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pagination .page-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .pagination .page-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .pagination .page-info {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .paper {
    background: var(--card-bg);
    padding: 18px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }

  .paper.has-pdf {
    cursor: pointer;
  }

  .paper.has-pdf:hover {
    border-color: var(--accent);
  }

  .paper-ref {
    font-size: 0.98rem;
    margin: 0 0 10px;
    color: var(--text);
  }

  .paper-ref em {
    font-style: italic;
  }

  .paper-ref mark {
    background: rgba(54, 179, 255, 0.28);
    color: var(--accent-dark);
    font-weight: 600;
    border-radius: 3px;
    padding: 0 1px;
  }

  .paper-hint {
    font-size: 0.75rem;
    color: var(--accent-dark);
    margin: 0 0 10px;
  }

  .paper-pdf {
    display: none;
    margin-top: 14px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .paper.expanded .paper-pdf {
    display: block;
  }

  .paper-pdf iframe {
    width: 100%;
    height: 600px;
    border: none;
    display: block;
  }

  .paper-links a {
    color: var(--accent-dark);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    margin-right: 16px;
  }

  .paper-links a:hover {
    text-decoration: underline;
  }

  .paper-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .paper-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .paper-tags span {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--accent-dark);
    background: #eaf7ff;
    padding: 2px 9px;
    border-radius: 999px;
  }

  .paper-doi {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--accent-dark);
    text-decoration: none;
    white-space: nowrap;
    margin-left: auto;
  }

  .paper-doi:hover {
    text-decoration: underline;
  }

  .empty {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }

  .loading {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }

  @media (max-width: 700px) {
    header {
      padding: 14px 18px;
    }

    .header-subtitle {
      display: none;
    }

    .header-nav {
      gap: 12px;
    }

    .wrap {
      padding: 28px 14px 60px;
    }

    h1 {
      font-size: 1.6rem;
    }

    .paper {
      padding: 15px 16px;
    }
  }
</style>
</head>

<body>

<header>

  <div class="header-left">

    <img
      src="https://www.qmul.ac.uk/media/qmul/site-assets/images/logos/qmul-logo.svg"
      alt="Queen Mary University of London"
    >

    <div>
      <div class="header-title">
        Papers Database
      </div>

      <div class="header-subtitle">
        Queen Mary University of London
      </div>
    </div>

  </div>


  <nav class="header-nav">

    <a href="#">
      Home
    </a>

    <a href="#">
      About
    </a>

  </nav>

</header>


<div class="wrap">

  <div class="page-layout">

    <main class="main-content">

      <h1>
        Papers Database
      </h1>

      <p class="subtitle">
        Search, filter and browse papers.
      </p>


      <div class="controls">

        <div class="search-wrap">

          <input
            type="text"
            id="search"
            placeholder="Search papers..."
            autocomplete="off"
          >

          <button
            class="search-icon-btn"
            id="searchIconBtn"
            type="button"
            aria-label="Search"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >

              <circle
                cx="11"
                cy="11"
                r="7"
              ></circle>

              <line
                x1="16.65"
                y1="16.65"
                x2="21"
                y2="21"
              ></line>

            </svg>

          </button>

        </div>


        <button
          class="filter-toggle-btn"
          id="filterToggle"
          type="button"
        >
          Filters
        </button>

      </div>


      <div class="count-row">

        <span
          class="count"
          id="count"
        >
          0 papers
        </span>


        <label class="page-size-label">

          Papers per page

          <select id="pageSize">

            <option value="10">
              10
            </option>

            <option value="25">
              25
            </option>

            <option value="50">
              50
            </option>

            <option value="100">
              100
            </option>

          </select>

        </label>

      </div>


      <div
        id="results"
      ></div>


      <div
        class="pagination"
        id="pagination"
      ></div>

    </main>


    <aside class="filter-sidebar">

      <div
        class="filter-panel"
        id="filterPanel"
      >

        <div class="filter-group">

          <label>
            Year
          </label>

          <div class="year-range">

            <input
              type="number"
              id="yearFrom"
              placeholder="From"
            >

            <span>
              –
            </span>

            <input
              type="number"
              id="yearTo"
              placeholder="To"
            >

          </div>

        </div>


        <div class="filter-group">

          <label>
            Authors
          </label>

          <div
            class="multiselect"
            id="authorSelect"
          >

            <div
              class="multiselect-chips"
              id="authorChips"
            ></div>

            <input
              type="text"
              id="authorInput"
              placeholder="Search authors..."
              autocomplete="off"
            >

            <div
              class="multiselect-dropdown"
              id="authorDropdown"
            ></div>

          </div>

        </div>


        <div class="filter-group">

          <label>
            Institutions
          </label>

          <div
            class="multiselect"
            id="institutionSelect"
          >

            <div
              class="multiselect-chips"
              id="institutionChips"
            ></div>

            <input
              type="text"
              id="institutionInput"
              placeholder="Search institutions..."
              autocomplete="off"
            >

            <div
              class="multiselect-dropdown"
              id="institutionDropdown"
            ></div>

          </div>

        </div>


        <button
          class="clear-filters-btn"
          id="clearFilters"
          type="button"
        >
          Clear filters
        </button>

      </div>

    </aside>

  </div>

</div>


<script>

  /*
   * ---------------------------------------------------------
   * DATA
   * ---------------------------------------------------------
   *
   * Paper data is loaded here.
   *
   * The original paper data is intentionally preserved.
   */

  const papers = [
    /* YOUR ORIGINAL PAPER DATA REMAINS HERE */
  ];


  /*
   * ---------------------------------------------------------
   * STATE
   * ---------------------------------------------------------
   */

  let filteredPapers = [];

  let currentPage = 1;

  let pageSize = 10;

  let sortKey = "year";

  let sortDir = "desc";

  let lastFilterState = null;


  const selectedAuthors =
    new Set();


  const selectedInstitutions =
    new Set();


  /*
   * ---------------------------------------------------------
   * HELPERS
   * ---------------------------------------------------------
   */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function normalise(
    value
  ) {

    return String(
      value ?? ""
    )
      .toLowerCase()
      .trim();

  }


  function filterStateEqual(
    a,
    b
  ) {

    if (!a || !b) {

      return false;

    }


    if (
      a.search !== b.search ||
      a.yearFrom !== b.yearFrom ||
      a.yearTo !== b.yearTo
    ) {

      return false;

    }


    if (
      a.authors.length !==
      b.authors.length
    ) {

      return false;

    }


    if (
      a.institutions.length !==
      b.institutions.length
    ) {

      return false;

    }


    for (
      let i = 0;
      i < a.authors.length;
      i++
    ) {

      if (
        a.authors[i] !==
        b.authors[i]
      ) {

        return false;

      }

    }


    for (
      let i = 0;
      i < a.institutions.length;
      i++
    ) {

      if (
        a.institutions[i] !==
        b.institutions[i]
      ) {

        return false;

      }

    }


    return true;

  }


  /*
   * ---------------------------------------------------------
   * PREPARE DATA
   * ---------------------------------------------------------
   */

  papers.forEach(
    p => {

      p.yearNumber =
        parseInt(
          p.year,
          10
        ) || 0;


      p.authorList =
        Array.isArray(
          p.authors
        )
          ? p.authors
          : [];


      p.institutionList =
        Array.isArray(
          p.institutions
        )
          ? p.institutions
          : [];


      p.searchText =
        normalise(
          [
            p.title,
            p.year,
            p.journal,
            p.authors?.join(" "),
            p.institutions?.join(" "),
            p.doi,
            p.tags?.join(" ")
          ]
            .filter(Boolean)
            .join(" ")
        );

    }
  );


  /*
   * ---------------------------------------------------------
   * FILTER STATE
   * ---------------------------------------------------------
   */

  function getFilterState() {

    const search =
      normalise(
        document
          .getElementById(
            "search"
          )
          .value
      );


    const fromValue =
      document
        .getElementById(
          "yearFrom"
        )
        .value
        .trim();


    const toValue =
      document
        .getElementById(
          "yearTo"
        )
        .value
        .trim();


    const yearFrom =
      fromValue === ""
        ? null
        : Number(
            fromValue
          );


    const yearTo =
      toValue === ""
        ? null
        : Number(
            toValue
          );


    return {

      search,

      yearFrom,

      yearTo,

      authors:
        Array.from(
          selectedAuthors
        ).sort(),

      institutions:
        Array.from(
          selectedInstitutions
        ).sort()

    };

  }


  /*
   * ---------------------------------------------------------
   * FILTER OPTIONS
   * ---------------------------------------------------------
   */

  const allAuthors =
    Array.from(
      new Set(
        papers.flatMap(
          p =>
            p.authorList
        )
      )
    ).sort(
      (a, b) =>
        a.localeCompare(
          b
        )
    );


  const allInstitutions =
    Array.from(
      new Set(
        papers.flatMap(
          p =>
            p.institutionList
        )
      )
    ).sort(
      (a, b) =>
        a.localeCompare(
          b
        )
    );


  /*
   * ---------------------------------------------------------
   * MULTISELECT
   * ---------------------------------------------------------
   */

  function setupMultiselect(
    inputId,
    dropdownId,
    chipsId,
    options,
    selectedSet
  ) {

    const input =
      document.getElementById(
        inputId
      );


    const dropdown =
      document.getElementById(
        dropdownId
      );


    const chips =
      document.getElementById(
        chipsId
      );


    function renderChips() {

      chips.innerHTML =
        Array.from(
          selectedSet
        )
          .map(
            value => `

              <span class="chip">

                ${escapeHtml(
                  value
                )}

                <button
                  type="button"
                  data-value="${escapeHtml(
                    value
                  )}"
                  aria-label="Remove ${escapeHtml(
                    value
                  )}"
                >
                  ×
                </button>

              </span>

            `
          )
          .join("");


      chips
        .querySelectorAll(
          "button"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                selectedSet.delete(
                  button.dataset.value
                );

                renderChips();

                renderOptions(
                  input.value
                );

                currentPage = 1;

                render();

              }
            );

          }
        );

    }


    function renderOptions(
      query = ""
    ) {

      const q =
        normalise(
          query
        );


      const matches =
        options.filter(
          option => {

            if (
              selectedSet.has(
                option
              )
            ) {

              return false;

            }


            return normalise(
              option
            ).includes(
              q
            );

          }
        );


      if (!matches.length) {

        dropdown.innerHTML =
          `
            <div class="no-results">
              No results
            </div>
          `;

      } else {

        dropdown.innerHTML =
          matches
            .map(
              option => `

                <div
                  class="option"
                  data-value="${escapeHtml(
                    option
                  )}"
                >
                  ${escapeHtml(
                    option
                  )}
                </div>

              `
            )
            .join("");

      }


      dropdown
        .querySelectorAll(
          ".option"
        )
        .forEach(
          optionEl => {

            optionEl.addEventListener(
              "click",
              () => {

                selectedSet.add(
                  optionEl.dataset.value
                );

                input.value = "";

                renderChips();

                renderOptions();

                dropdown.classList.add(
                  "open"
                );

                currentPage = 1;

                render();

              }
            );

          }
        );

    }


    input.addEventListener(
      "focus",
      () => {

        renderOptions(
          input.value
        );

        dropdown.classList.add(
          "open"
        );

      }
    );


    input.addEventListener(
      "input",
      () => {

        renderOptions(
          input.value
        );

        dropdown.classList.add(
          "open"
        );

      }
    );


    document.addEventListener(
      "click",
      e => {

        if (
          !e.target.closest(
            `#${inputId}`
          ) &&
          !e.target.closest(
            `#${dropdownId}`
          )
        ) {

          dropdown.classList.remove(
            "open"
          );

        }

      }
    );


    renderChips();

  }


  setupMultiselect(
    "authorInput",
    "authorDropdown",
    "authorChips",
    allAuthors,
    selectedAuthors
  );


  setupMultiselect(
    "institutionInput",
    "institutionDropdown",
    "institutionChips",
    allInstitutions,
    selectedInstitutions
  );


  /*
   * ---------------------------------------------------------
   * FILTER BUTTON
   * ---------------------------------------------------------
   */

  document
    .getElementById(
      "filterToggle"
    )
    .addEventListener(
      "click",
      () => {

        const panel =
          document.getElementById(
            "filterPanel"
          );


        const button =
          document.getElementById(
            "filterToggle"
          );


        panel.classList.toggle(
          "open"
        );


        button.classList.toggle(
          "active"
        );

      }
    );


  /*
   * ---------------------------------------------------------
   * SEARCH
   * ---------------------------------------------------------
   */

  document
    .getElementById(
      "search"
    )
    .addEventListener(
      "input",
      () => {

        currentPage = 1;

        render();

      }
    );


  document
    .getElementById(
      "searchIconBtn"
    )
    .addEventListener(
      "click",
      () => {

        document
          .getElementById(
            "search"
          )
          .focus();

      }
    );


  /*
   * ---------------------------------------------------------
   * YEAR FILTERS
   * ---------------------------------------------------------
   */

  document
    .getElementById(
      "yearFrom"
    )
    .addEventListener(
      "input",
      () => {

        currentPage = 1;

        render();

      }
    );


  document
    .getElementById(
      "yearTo"
    )
    .addEventListener(
      "input",
      () => {

        currentPage = 1;

        render();

      }
    );


  /*
   * ---------------------------------------------------------
   * PAGE SIZE
   * ---------------------------------------------------------
   */

  document
    .getElementById(
      "pageSize"
    )
    .addEventListener(
      "change",
      e => {

        pageSize =
          Number(
            e.target.value
          );

        currentPage = 1;

        render();

      }
    );


  /*
   * ---------------------------------------------------------
   * CLEAR FILTERS
   * ---------------------------------------------------------
   */

  document
    .getElementById(
      "clearFilters"
    )
    .addEventListener(
      "click",
      () => {

        document
          .getElementById(
            "search"
          )
          .value = "";


        document
          .getElementById(
            "yearFrom"
          )
          .value = "";


        document
          .getElementById(
            "yearTo"
          )
          .value = "";


        selectedAuthors.clear();

        selectedInstitutions.clear();


        document
          .getElementById(
            "authorChips"
          )
          .innerHTML = "";


        document
          .getElementById(
            "institutionChips"
          )
          .innerHTML = "";


        currentPage = 1;


        lastFilterState =
          null;


        render();

      }
    );


  /*
   * ---------------------------------------------------------
   * FILTER PAPERS
   * ---------------------------------------------------------
   *
   * This is now separate from rendering.
   *
   * It only runs when the actual filter state changes.
   */

  function filterPapers() {

    const state =
      getFilterState();


    if (
      filterStateEqual(
        state,
        lastFilterState
      )
    ) {

      return;

    }


    lastFilterState = state;


    const {
      search,
      yearFrom,
      yearTo,
      authors,
      institutions
    } = state;


    const authorSet =
      new Set(authors);

    const institutionSet =
      new Set(institutions);


    filteredPapers =
      papers.filter(p => {


        /*
         * Search
         */

        if (
          search &&
          !p.searchText.includes(search)
        ) {

          return false;

        }


        /*
         * Year
         */

        if (
          yearFrom !== null &&
          p.yearNumber < yearFrom
        ) {

          return false;

        }


        if (
          yearTo !== null &&
          p.yearNumber > yearTo
        ) {

          return false;

        }


        /*
         * Author
         */

        if (
          authorSet.size > 0 &&
          !p.authorList.some(
            author =>
              authorSet.has(author)
          )
        ) {

          return false;

        }


        /*
         * Institution
         */

        if (
          institutionSet.size > 0 &&
          !p.institutionList.some(
            institution =>
              institutionSet.has(institution)
          )
        ) {

          return false;

        }


        return true;

      });


    /*
     * Sort ONLY when the filtered list changes.
     *
     * Pagination does not cause this sort to run again.
     */

    filteredPapers.sort(
      (a, b) => {

        let va;
        let vb;


        if (sortKey === "year") {

          va = a.yearNumber;
          vb = b.yearNumber;

        } else {

          va =
            String(
              a[sortKey] || ""
            ).toLowerCase();

          vb =
            String(
              b[sortKey] || ""
            ).toLowerCase();

        }


        if (va < vb) {

          return sortDir === "asc"
            ? -1
            : 1;

        }


        if (va > vb) {

          return sortDir === "asc"
            ? 1
            : -1;

        }


        return 0;

      }
    );

  }


  /*
   * ---------------------------------------------------------
   * MAIN RENDER
   * ---------------------------------------------------------
   */

  function render() {

    /*
     * Only run the expensive filtering/sorting stage
     * when the filters have actually changed.
     */

    filterPapers();

    renderResults();

  }


  /*
   * ---------------------------------------------------------
   * RENDER RESULTS
   * ---------------------------------------------------------
   *
   * Only the current page is converted into HTML.
   */

  function renderResults() {

    const rawQuery =
      document
        .getElementById("search")
        .value
        .trim();


    const countEl =
      document.getElementById("count");


    countEl.textContent =
      `${filteredPapers.length} paper${
        filteredPapers.length === 1
          ? ""
          : "s"
      }`;


    const totalPages =
      Math.max(
        1,
        Math.ceil(
          filteredPapers.length /
          pageSize
        )
      );


    if (
      currentPage >
      totalPages
    ) {

      currentPage =
        totalPages;

    }


    const startIdx =
      (currentPage - 1) *
      pageSize;


    const pageItems =
      filteredPapers.slice(
        startIdx,
        startIdx + pageSize
      );


    const resultsEl =
      document.getElementById("results");


    if (!pageItems.length) {

      resultsEl.innerHTML =
        '<div class="empty">No papers match your search.</div>';

      renderPagination(
        totalPages
      );

      return;

    }


    /*
     * Build only the visible page.
     */

    resultsEl.innerHTML =
      pageItems
        .map(p => {


          const viewerUrl =
            p.pdf_url
              ? `https://docs.google.com/viewer?url=${encodeURIComponent(
                  p.pdf_url
                )}&embedded=true`
              : "";


          const tagsHtml =
            p.tags.length

              ? `
                <div class="paper-tags">
                  ${p.tags
                    .map(
                      t =>
                        `<span>${escapeHtml(t)}</span>`
                    )
                    .join("")}
                </div>
              `

              : "<span></span>";


          const pdfHtml =
            p.pdf_url

              ? `
                <div class="paper-pdf">
                  <iframe
                    data-src="${escapeHtml(viewerUrl)}"
                    title="PDF preview"
                  ></iframe>
                </div>
              `

              : "";


          return `

            <div
              class="paper ${
                p.pdf_url
                  ? "has-pdf"
                  : ""
              }"
            >

              <p class="paper-ref">
                ${formatIEEE(
                  p,
                  rawQuery
                )}
              </p>


              ${
                p.pdf_url

                  ? `
                    <p class="paper-hint">
                      Click to preview PDF
                    </p>
                  `

                  : ""
              }


              <div class="paper-links">

                ${
                  p.pdf_url

                    ? `
                      <a
                        href="${escapeHtml(p.pdf_url)}"
                        target="_blank"
                        rel="noopener"
                      >
                        Host link
                      </a>
                    `

                    : ""
                }

              </div>


              <div class="paper-footer">

                ${tagsHtml}


                ${
                  p.doi

                    ? `
                      <a
                        class="paper-doi"
                        href="https://doi.org/${encodeURIComponent(
                          p.doi
                        )}"
                        target="_blank"
                        rel="noopener"
                      >
                        DOI: ${escapeHtml(p.doi)}
                      </a>
                    `

                    : ""
                }

              </div>


              ${pdfHtml}

            </div>

          `;

        })
        .join("");


    renderPagination(
      totalPages
    );

  }


  /*
   * ---------------------------------------------------------
   * PAGINATION
   * ---------------------------------------------------------
   */

  function renderPagination(
    totalPages
  ) {

    const el =
      document.getElementById(
        "pagination"
      );


    if (totalPages <= 1) {

      el.innerHTML = "";

      return;

    }


    el.innerHTML = `

      <button
        class="page-btn"
        id="prevPage"
        ${
          currentPage === 1
            ? "disabled"
            : ""
        }
      >
        &larr; Prev
      </button>


      <span class="page-info">
        Page ${currentPage} of ${totalPages}
      </span>


      <button
        class="page-btn"
        id="nextPage"
        ${
          currentPage === totalPages
            ? "disabled"
            : ""
        }
      >
        Next &rarr;
      </button>

    `;


    document
      .getElementById("prevPage")
      .addEventListener(
        "click",
        () => {

          if (
            currentPage > 1
          ) {

            currentPage--;

            /*
             * IMPORTANT:
             *
             * render() is still safe here because
             * filterPapers() sees that the filter state
             * hasn't changed and immediately returns.
             */

            render();

            document
              .querySelector(".wrap")
              .scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

          }

        }
      );


    document
      .getElementById("nextPage")
      .addEventListener(
        "click",
        () => {

          if (
            currentPage <
            totalPages
          ) {

            currentPage++;

            render();

            document
              .querySelector(".wrap")
              .scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

          }

        }
      );

  }


  /*
   * ---------------------------------------------------------
   * PDF PREVIEW
   * ---------------------------------------------------------
   *
   * Event delegation means we only need ONE click listener
   * for all paper cards.
   */

  document
    .getElementById("results")
    .addEventListener(
      "click",
      (e) => {


        /*
         * Don't intercept DOI/host links.
         */

        if (
          e.target.closest("a")
        ) {

          return;

        }


        const paperEl =
          e.target.closest(
            ".paper.has-pdf"
          );


        if (!paperEl) {

          return;

        }


        const isOpen =
          paperEl.classList.toggle(
            "expanded"
          );


        if (isOpen) {

          const iframe =
            paperEl.querySelector(
              ".paper-pdf iframe"
            );


          /*
           * Lazy-load the PDF viewer.
           *
           * The iframe doesn't actually load until
           * the user opens the paper.
           */

          if (
            iframe &&
            !iframe.src
          ) {

            iframe.src =
              iframe.dataset.src;

          }

        }

      }
    );


  /*
   * ---------------------------------------------------------
   * INITIAL RENDER
   * ---------------------------------------------------------
   */

  render();

</script>

</body>
</html>
