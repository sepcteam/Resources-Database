<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #36b3ff;
    --accent-dark: #1a8fd6;
    --text: #1c1c1c;
    --muted: #6b7280;
    --border: #dcdde0;
    --page-bg: #ececee;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: #ffffff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  header img {
    height: 34px;
    display: block;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
  }

  #search {
    flex: 1 1 260px;
    padding: 11px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: var(--card-bg);
    transition: border-color 0.15s ease;
  }

  #search:focus {
    border-color: var(--accent);
  }

  .sort-group {
    display: flex;
    gap: 6px;
  }

  .sort-btn {
    padding: 9px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .sort-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .sort-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .tag-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .tag-chip {
    padding: 5px 12px;
    font-size: 0.8rem;
    font-family: inherit;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tag-chip:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .tag-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .count {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }

  .paper {
    background: var(--card-bg);
    padding: 18px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }

  .paper.has-pdf {
    cursor: pointer;
  }

  .paper.has-pdf:hover {
    border-color: var(--accent);
  }

  .paper-ref {
    font-size: 0.98rem;
    margin: 0 0 10px;
    color: var(--text);
  }

  .paper-ref em {
    font-style: italic;
  }

  .paper-ref mark {
    background: rgba(54, 179, 255, 0.28);
    color: var(--accent-dark);
    font-weight: 600;
    border-radius: 3px;
    padding: 0 1px;
  }

  .paper-hint {
    font-size: 0.75rem;
    color: var(--accent-dark);
    margin: 0 0 10px;
  }

  .paper-pdf {
    display: none;
    margin-top: 14px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .paper.expanded .paper-pdf {
    display: block;
  }

  .paper-pdf iframe {
    width: 100%;
    height: 600px;
    border: none;
    display: block;
  }

  .paper-links a {
    color: var(--accent-dark);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    margin-right: 16px;
  }

  .paper-links a:hover {
    text-decoration: underline;
  }

  .paper-tags {
    margin-top: 10px;
  }

  .paper-tags span {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--accent-dark);
    background: #eaf7ff;
    padding: 2px 9px;
    border-radius: 999px;
    margin-right: 6px;
    margin-top: 4px;
  }

  .empty {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }

  .loading {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }
</style>
</head>
<body>
  <header>
    <img src="logo.png" alt="SEPC logo">
  </header>

  <div class="wrap">
    <h1>Paper Database</h1>
    <p class="subtitle">Search and browse papers, linked to DOI and host pages.</p>

    <div class="controls">
      <input type="search" id="search" placeholder="Search title, author, keyword…">
      <div class="sort-group">
        <button class="sort-btn active" data-sort="year">Year</button>
        <button class="sort-btn" data-sort="title">Title</button>
        <button class="sort-btn" data-sort="authors">Author</button>
      </div>
    </div>

    <div class="tag-filters" id="tagFilters"></div>
    <div class="count" id="count"></div>
    <div id="results"><div class="loading">Loading papers…</div></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  const CSV_URL = "Papers.csv"; // same repo, or replace with a published Google Sheet CSV URL

  let papers = [];
  let activeTag = null;
  let sortKey = "year";
  let sortDir = "desc";

  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: (r) => {
      papers = r.data.map(p => ({
        ...p,
        tags: (p.tags || "").split(",").map(t => t.trim()).filter(Boolean)
      }));
      buildTagFilters();
      render();
    },
    error: () => {
      document.getElementById("results").innerHTML =
        '<div class="empty">Could not load Papers.csv — check the file is in the same folder.</div>';
    }
  });

  function buildTagFilters() {
    const allTags = [...new Set(papers.flatMap(p => p.tags))].sort();
    const el = document.getElementById("tagFilters");
    el.innerHTML = allTags.map(t =>
      `<button class="tag-chip" data-tag="${t}">${t}</button>`
    ).join("");
    el.querySelectorAll(".tag-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const tag = btn.dataset.tag;
        activeTag = activeTag === tag ? null : tag;
        el.querySelectorAll(".tag-chip").forEach(b =>
          b.classList.toggle("active", b.dataset.tag === activeTag)
        );
        render();
      });
    });
  }

  document.getElementById("search").addEventListener("input", render);

  document.querySelectorAll(".sort-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.sort;
      if (sortKey === key) {
        sortDir = sortDir === "asc" ? "desc" : "asc";
      } else {
        sortKey = key;
        sortDir = key === "year" ? "desc" : "asc";
      }
      document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
  });

  // Escapes regex special characters so the raw search text can be used safely in a RegExp
  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  // Wraps every case-insensitive match of `query` in a <mark> tag, applied per-field
  // (never to the already-built HTML string) so highlighting can't land inside a tag like <em>
  function highlightMatch(text, query) {
    if (!text) return "";
    if (!query) return text;
    const re = new RegExp(escapeRegExp(query), "gi");
    return text.replace(re, (m) => `<mark>${m}</mark>`);
  }

  // Formats a row into an IEEE-style reference string from its structured fields
  function formatIEEE(p, query) {
    let ref = "";
    if (p.authors) ref += `${highlightMatch(p.authors, query)}, `;
    if (p.title) ref += `"${highlightMatch(p.title, query)}," `;
    if (p.journal) ref += `<em>${highlightMatch(p.journal, query)}</em>`;
    if (p.volume) ref += `, vol. ${p.volume}`;
    if (p.issue) ref += `, no. ${p.issue}`;
    if (p.pages) ref += `, pp. ${p.pages}`;
    if (p.year) ref += `, ${highlightMatch(String(p.year), query)}`;
    ref += ".";
    return ref;
  }

  function render() {
    const rawQuery = document.getElementById("search").value;
    const q = rawQuery.toLowerCase();

    let list = papers.filter(p => {
      const matchesSearch = !q || Object.values(p).join(" ").toLowerCase().includes(q);
      const matchesTag = !activeTag || p.tags.includes(activeTag);
      return matchesSearch && matchesTag;
    });

    list.sort((a, b) => {
      let va = (a[sortKey] || "").toString().toLowerCase();
      let vb = (b[sortKey] || "").toString().toLowerCase();
      if (sortKey === "year") { va = parseInt(va) || 0; vb = parseInt(vb) || 0; }
      if (va < vb) return sortDir === "asc" ? -1 : 1;
      if (va > vb) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    document.getElementById("count").textContent =
      `${list.length} paper${list.length === 1 ? "" : "s"}`;

    document.getElementById("results").innerHTML = list.length
      ? list.map(p => `
        <div class="paper ${p.pdf_url ? "has-pdf" : ""}">
          <p class="paper-ref">${formatIEEE(p, rawQuery)}</p>
          ${p.pdf_url ? `<p class="paper-hint">Click to preview PDF</p>` : ""}
          <div class="paper-links">
            ${p.doi ? `<a href="https://doi.org/${p.doi}" target="_blank" rel="noopener">DOI</a>` : ""}
            ${p.pdf_url ? `<a href="${p.pdf_url}" target="_blank" rel="noopener">Host link</a>` : ""}
          </div>
          ${p.tags.length ? `<div class="paper-tags">${p.tags.map(t => `<span>${t}</span>`).join("")}</div>` : ""}
          ${p.pdf_url ? `
            <div class="paper-pdf">
              <iframe data-src="${p.pdf_url}" title="PDF preview"></iframe>
            </div>
          ` : ""}
        </div>
      `).join("")
      : '<div class="empty">No papers match your search.</div>';
  }

  // Click a paper box (but not a link inside it) to expand/collapse its PDF preview
  document.getElementById("results").addEventListener("click", (e) => {
    if (e.target.closest("a")) return; // let DOI/host links behave normally

    const paperEl = e.target.closest(".paper.has-pdf");
    if (!paperEl) return;

    const isOpen = paperEl.classList.toggle("expanded");
    if (isOpen) {
      const iframe = paperEl.querySelector(".paper-pdf iframe");
      if (iframe && !iframe.src) iframe.src = iframe.dataset.src;
    }
  });
</script>
</body>
</html>
