<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papers Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  
  :root {
    --accent: #36b3ff;
    --accent-dark: #1a8fd6;
    --text: #1c1c1c;
    --muted: #6b7280;
    --border: #dcdde0;
    --page-bg: #ececee;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: #ffffff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header img {
    height: 34px;
    display: block;
  }

  .header-title {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header-subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 400;
  }

  .header-nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .header-nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
  }

  .header-nav a:hover {
    color: var(--accent-dark);
  }

  .page-layout {
    display: grid;
    grid-template-columns: minmax(0, 1100px) 280px;
    gap: 24px;
    align-items: start;
  }

  .main-content {
    min-width: 0;
  }

  .filter-sidebar {
    min-width: 0;
  }

  .filter-sidebar .filter-panel {
    margin-bottom: 0;
  }

  @media (max-width: 960px) {
    .page-layout {
      grid-template-columns: 1fr;
    }

    .filter-sidebar {
      order: -1;
    }

    .filter-sidebar .filter-panel {
      position: static;
    }
  }

  .wrap {
    max-width: 1420px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    transform: translateX(120px);
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    position: relative;
  }

  #search {
    flex: 1 1 260px;
    padding: 11px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: var(--card-bg);
    transition: border-color 0.15s ease;
  }

  #search:focus {
    border-color: var(--accent);
  }

  .filter-toggle-btn {
    padding: 9px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .filter-toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .filter-toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 260px;
  }

  .search-wrap #search {
    width: 100%;
    padding-left: 40px;
  }

  .search-icon-btn {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-icon-btn:hover {
    color: var(--accent-dark);
  }

  .search-icon-btn svg {
    width: 17px;
    height: 17px;
  }

  .filter-panel {
    display: none;
    flex-direction: column;
    gap: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    position: sticky;
    top: 20px;
  }

  .filter-panel.open {
    display: flex;
  }


  .filter-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .year-range {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .year-range input[type="number"] {
    width: 110px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .year-range input[type="number"]:focus {
    border-color: var(--accent);
  }

  .year-range span {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .multiselect {
    position: relative;
  }

  .multiselect-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .multiselect-chips .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #eaf7ff;
    color: var(--accent-dark);
    font-size: 0.8rem;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
  }

  .multiselect-chips .chip button {
    background: none;
    border: none;
    color: var(--accent-dark);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0 2px;
  }

  .multiselect input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .multiselect input[type="text"]:focus {
    border-color: var(--accent);
  }

  .multiselect-dropdown {
    display: none;
    position: static;
    z-index: 20;
    width: 100%;
    margin-top: 4px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    max-height: 220px;
    overflow-y: auto;
  }

  .multiselect-dropdown.open {
    display: block;
  }

  .multiselect-dropdown .option {
    padding: 8px 12px;
    font-size: 0.87rem;
    cursor: pointer;
  }

  .multiselect-dropdown .option:hover {
    background: #f3f9ff;
  }

  .multiselect-dropdown .no-results {
    padding: 8px 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .clear-filters-btn {
    align-self: flex-start;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
  }

  .clear-filters-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .navigation-actions {
  position: absolute;
  right: 100%;          
  top: 50%;
  transform: translateY(-50%);   
  margin-right: 12px;    
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  }
  
.author-profile {
  display: none;
  position: fixed;
  width: 200px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  z-index: 15;
}

.author-profile.visible {
  display: block;
}

.upload-box {
background: transparent !important;
  position: fixed;
  left: 24px;
  bottom: 24px;
  width: 220px;
  min-height: 140px;
  background: transparent !important;
  border: 2px dashed #333;
  border-radius: 10px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  z-index: 15;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.upload-box.dragover {
  background: #eaf7ff;
  border-color: var(--accent);
}

.upload-box svg {
  width: 32px;
  height: 32px;
  color: var(--muted);
  margin-bottom: 10px;
}

.upload-box-text {
  font-size: 0.85rem;
  font-weight: 500;
}

.upload-box-hint {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.4;
}

.upload-box input[type="file"] {
  display: none;
}

  .navigation-btn {
    padding: 8px 14px;
    font-size: 0.8rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--accent-dark);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .navigation-btn:hover:not(:disabled) {
    
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  

  .navigation-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .paper-access-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 10px;
  }

  .paper-source {
    color: var(--accent-dark);
    font-size: 0.82rem;
  }

  .paper-access-btn {
    display: inline-block;
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--accent-dark);
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    white-space: nowrap;
    transition: all 0.15s ease;
    margin-left: auto;
  }

  .paper-access-btn:hover {
  border-color: var(--accent);
  color: var(--accent-dark);
  text-decoration: none;
}



  .page-size-label {
    color: var(--muted);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .page-size-label select {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 4px 8px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 24px;
  }

  .pagination .page-btn {
    padding: 8px 16px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pagination .page-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .pagination .page-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .pagination .page-info {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .paper {
    background: var(--card-bg);
    padding: 18px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }

  .paper-ref {
    font-size: 0.98rem;
    margin: 0 0 10px;
    color: var(--text);
  }

  
  .paper-ref em {
    font-style: italic;
  }

  .paper mark {
    background: rgba(54, 179, 255, 0.28);
    color: var(--accent-dark);
    font-weight: 600;
    border-radius: 3px;
    padding: 0 1px;
  }

  .paper-institution {
  font-size: 0.82rem;
  color: var(--muted);
  margin: 0 0 10px;
  }
  
  .paper-links a {
    color: var(--accent-dark);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    margin-right: 16px;
  }

  .paper-links a:hover {
    text-decoration: underline;
  }

  .paper-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .paper-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .paper-tags span {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--accent-dark);
    background: #eaf7ff;
    padding: 2px 9px;
    border-radius: 999px;
  }

  .paper-author-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 4px 10px;
    margin-left: auto;
    text-align: right;
  }

  .paper-author {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--accent-dark);
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }

  .paper-author:hover {
    text-decoration: underline;
  }

  .paper-doi {
    display: block;
    width: 100%;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--accent-dark);
    text-decoration: none;
    text-align: right;
    margin-left: auto;
    margin-top: 2px;
  }

  .paper-doi:hover {
    text-decoration: underline;
  }

  .empty {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }

  .loading {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }
  
  .filter-toggle-btn:active,
.clear-filters-btn:active,
.pagination .page-btn:active:not(:disabled),
.navigation-btn:active:not(:disabled),
.paper-access-btn:active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
  

  @media (max-width: 960px) {
    .author-profile {
      position: fixed;
      left: 12px !important;
      right: 12px;
      width: auto;
      top: auto !important;
      bottom: 180px;
    }

    .upload-box {
background: transparent;
      left: 12px !important;
      right: 12px;
      bottom: 20px !important;
      width: auto;
      min-height: 120px;
    }
  }

</style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="SEPC.png" alt="SEPC logo">
    <div class="header-title">Papers Database</div>
    <div class="header-subtitle">Courtesy of the SEPC team</div>
  </div>

  <nav class="header-nav" aria-label="Main navigation">
    <a href="use-and-moderation.html">Use of the site</a>
  </nav>
</header>

<div class="wrap">

  <div class="page-layout">

    <main class="main-content">
      <div class="controls">
        <div class="navigation-actions">
        <button
          class="navigation-btn"
          id="backButton"
          type="button"
          disabled
        >
          &larr; Back
        </button>

        <button
          class="navigation-btn"
          id="backToAll"
          type="button"
        >
          Back to all papers
        </button>
        </div>

        <aside class="author-profile" id="authorProfile">
          <div class="author-profile-name" id="authorProfileName"></div>
          <div class="author-profile-count" id="authorProfileCount"></div>
          
        </aside>

        <div class="search-wrap">

          <button
            class="search-icon-btn"
            id="searchIconBtn"
            type="button"
            aria-label="Search"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>

          <input
            type="search"
            id="search"
            placeholder="Search title, author, keyword…"
          >

        </div>

        <button class="filter-toggle-btn" id="filterToggle">
          Filters
        </button>
      </div>

      

      <div class="count-row">
        <div class="count" id="count"></div>

        <label class="page-size-label">
          Show
          <select id="pageSize">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
          per page
        </label>
      </div>

      <div id="results">
        <div class="loading">Loading papers…</div>
      </div>

      <div
        class="pagination"
        id="pagination"
      ></div>
    </main>

    <aside class="filter-sidebar" aria-label="Paper filters">
      <div class="filter-panel" id="filterPanel">

        <div class="filter-group">
          <label>Year range</label>

          <div class="year-range">
            <input
              type="number"
              id="yearFrom"
              placeholder="From"
              min="0"
              step="1"
              inputmode="numeric"
            >

            <span>&ndash;</span>

            <input
              type="number"
              id="yearTo"
              placeholder="To"
              min="0"
              step="1"
              inputmode="numeric"
            >
          </div>
        </div>

        <div class="filter-group">
          <label>Author</label>

          <div class="multiselect">
            <div
              class="multiselect-chips"
              id="authorChips"
            ></div>

            <input
              type="text"
              id="authorSearch"
              placeholder="Search authors…"
              autocomplete="off"
            >

            <div
              class="multiselect-dropdown"
              id="authorDropdown"
            ></div>
          </div>
        </div>

        <div class="filter-group">
          <label>Institution</label>

          <div class="multiselect">
            <div
              class="multiselect-chips"
              id="institutionChips"
            ></div>

            <input
              type="text"
              id="institutionSearch"
              placeholder="Search institutions…"
              autocomplete="off"
            >

            <div
              class="multiselect-dropdown"
              id="institutionDropdown"
            ></div>
          </div>
        </div>

        <button
          class="clear-filters-btn"
          id="clearFilters"
        >
          Clear all filters
        </button>

      </div>
    </aside>

  </div>

</div>

<div class="upload-box" id="uploadBox">
  <input type="file" id="uploadFileInput" accept="application/pdf" multiple>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 16V4M12 4L7 9M12 4l5 5"></path>
    <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
  </svg>
  <div class="upload-box-text">Click or drag a paper here to submit</div>
  <div class="upload-box-hint">
    Please format the title in IEEE reference style.<br>
    Submissions are reviewed before being added.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

    function positionMarginBoxes() {
    const controlsEl = document.querySelector(".controls");
    if (!controlsEl) return;
  
    const rect = controlsEl.getBoundingClientRect();
  
    const authorProfileEl = document.getElementById("authorProfile");
    if (authorProfileEl) {
      const w = authorProfileEl.offsetWidth || 200;
      authorProfileEl.style.left = `${Math.max(12, rect.left / 2 - w / 2)}px`;
      authorProfileEl.style.top = `${rect.top}px`;
    }
  
    const uploadBoxEl = document.getElementById("uploadBox");
    if (uploadBoxEl) {
      const w = uploadBoxEl.offsetWidth || 220;
      const gapStart = rect.right;
      const gapWidth = window.innerWidth - gapStart;
      uploadBoxEl.style.left = `${Math.max(12, gapStart + gapWidth / 2 - w / 2)}px`;
      uploadBoxEl.style.top = "auto";
      uploadBoxEl.style.bottom = "24px";
    }
  }
