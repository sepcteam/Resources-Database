<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #36b3ff;
    --accent-dark: #1a8fd6;
    --text: #1c1c1c;
    --muted: #6b7280;
    --border: #dcdde0;
    --page-bg: #ececee;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: #ffffff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  header img {
    height: 34px;
    display: block;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }

  #search {
    flex: 1 1 260px;
    padding: 11px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: var(--card-bg);
    transition: border-color 0.15s ease;
  }

  #search:focus {
    border-color: var(--accent);
  }

  .filter-toggle-btn {
    padding: 9px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .filter-toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .filter-toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 260px;
  }

  .search-wrap #search {
    width: 100%;
    padding-left: 40px;
  }

  .search-icon-btn {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-icon-btn:hover {
    color: var(--accent-dark);
  }

  .search-icon-btn svg {
    width: 17px;
    height: 17px;
  }

  /* Filter panel */
  .filter-panel {
    display: none;
    flex-direction: column;
    gap: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 24px;
  }

  .filter-panel.open {
    display: flex;
  }

  .filter-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .year-range {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .year-range input[type="number"] {
    width: 110px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .year-range input[type="number"]:focus {
    border-color: var(--accent);
  }

  .year-range span {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .multiselect {
    position: relative;
  }

  .multiselect-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .multiselect-chips .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #eaf7ff;
    color: var(--accent-dark);
    font-size: 0.8rem;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
  }

  .multiselect-chips .chip button {
    background: none;
    border: none;
    color: var(--accent-dark);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0 2px;
  }

  .multiselect input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .multiselect input[type="text"]:focus {
    border-color: var(--accent);
  }

  .multiselect-dropdown {
    display: none;
    position: absolute;
    z-index: 20;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    max-height: 220px;
    overflow-y: auto;
  }

  .multiselect-dropdown.open {
    display: block;
  }

  .multiselect-dropdown .option {
    padding: 8px 12px;
    font-size: 0.87rem;
    cursor: pointer;
  }

  .multiselect-dropdown .option:hover {
    background: #f3f9ff;
  }

  .multiselect-dropdown .no-results {
    padding: 8px 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .clear-filters-btn {
    align-self: flex-start;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
  }

  .clear-filters-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .count {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .page-size-label {
    color: var(--muted);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .page-size-label select {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 4px 8px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 24px;
  }

  .pagination .page-btn {
    padding: 8px 16px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pagination .page-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .pagination .page-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .pagination .page-info {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .paper {
    background: var(--card-bg);
    padding: 18px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }

  .paper.has-pdf {
    cursor: pointer;
  }

  .paper.has-pdf:hover {
    border-color: var(--accent);
  }

  .paper-ref {
    font-size: 0.98rem;
    margin: 0 0 10px;
    color: var(--text);
  }

  .paper-ref em {
    font-style: italic;
  }

  .paper-ref mark {
    background: rgba(54, 179, 255, 0.28);
    color: var(--accent-dark);
    font-weight: 600;
    border-radius: 3px;
    padding: 0 1px;
  }

  .paper-hint {
    font-size: 0.75rem;
    color: var(--accent-dark);
    margin: 0 0 10px;
  }

  .paper-pdf {
    display: none;
    margin-top: 14px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .paper.expanded .paper-pdf {
    display: block;
  }

  .paper-pdf iframe {
    width: 100%;
    height: 600px;
    border: none;
    display: block;
  }

  .paper-links a {
    color: var(--accent-dark);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    margin-right: 16px;
  }

  .paper-links a:hover {
    text-decoration: underline;
  }

  .paper-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .paper-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .paper-tags span {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--accent-dark);
    background: #eaf7ff;
    padding: 2px 9px;
    border-radius: 999px;
  }

  .paper-doi {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--accent-dark);
    text-decoration: none;
    white-space: nowrap;
    margin-left: auto;
  }

  .paper-doi:hover {
    text-decoration: underline;
  }

  .empty {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }

  .loading {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }
</style>
</head>
<body>
  <header>
    <img src="SEPC.png" alt="SEPC logo">
  </header>

  <div class="wrap">
    <h1>Paper Database</h1>
    <p class="subtitle">Search and browse papers, linked to DOI and host pages.</p>

    <div class="controls">
      <div class="search-wrap">
        <button class="search-icon-btn" id="searchIconBtn" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <input type="search" id="search" placeholder="Search title, author, keyword…">
      </div>
      <button class="filter-toggle-btn" id="filterToggle">Filters</button>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-group">
        <label>Year range</label>
        <div class="year-range">
          <input type="number" id="yearFrom" placeholder="From">
          <span>&ndash;</span>
          <input type="number" id="yearTo" placeholder="To">
        </div>
      </div>

      <div class="filter-group">
        <label>Author</label>
        <div class="multiselect">
          <div class="multiselect-chips" id="authorChips"></div>
          <input type="text" id="authorSearch" placeholder="Search authors…" autocomplete="off">
          <div class="multiselect-dropdown" id="authorDropdown"></div>
        </div>
      </div>

      <div class="filter-group">
        <label>Institution</label>
        <div class="multiselect">
          <div class="multiselect-chips" id="institutionChips"></div>
          <input type="text" id="institutionSearch" placeholder="Search institutions…" autocomplete="off">
          <div class="multiselect-dropdown" id="institutionDropdown"></div>
        </div>
      </div>

      <button class="clear-filters-btn" id="clearFilters">Clear all filters</button>
    </div>

    <div class="count-row">
      <div class="count" id="count"></div>
      <label class="page-size-label">
        Show
        <select id="pageSize">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
        per page
      </label>
    </div>
    <div id="results"><div class="loading">Loading papers…</div></div>
    <div class="pagination" id="pagination"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  const CSV_URL = "Papers.csv"; // must match the exact filename/case in the repo

  let papers = [];
  let sortKey = "year";
  let sortDir = "desc";
  let currentPage = 1;
  let pageSize = 50;

  const selectedAuthors = new Set();
  const selectedInstitutions = new Set();

  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: (r) => {
      papers = r.data.map(p => {
        const withLists = {
          ...p,
          authorList: (p.authors || "").split(";").map(s => s.trim()).filter(Boolean),
          institutionList: (p.institution || "").split(";").map(s => s.trim()).filter(Boolean),
          tags: (p.tags || "").split(";").map(s => s.trim()).filter(Boolean)
        };
        withLists.searchText = Object.values(withLists).join(" ").toLowerCase();
        return withLists;
      });
      buildMultiselect(
        "authorSearch", "authorDropdown", "authorChips",
        [...new Set(papers.flatMap(p => p.authorList))].sort(),
        selectedAuthors
      );
      buildMultiselect(
        "institutionSearch", "institutionDropdown", "institutionChips",
        [...new Set(papers.flatMap(p => p.institutionList))].sort(),
        selectedInstitutions
      );
      render();
    },
    error: () => {
      document.getElementById("results").innerHTML =
        '<div class="empty">Could not load papers.csv — check the file exists in the same folder with this exact name and case.</div>';
    }
  });

  // Delays calling fn until the person pauses typing, so a full re-render doesn't
  // fire on every single keystroke — this is what removes the typing lag/flicker.
  function debounce(fn, delay) {
    let timer;
    return function (...args) {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, args), delay);
    };
  }

  // Any change to search text, filters, or sorting should jump back to page 1 —
  // only Prev/Next should move between pages of an already-settled result set.
  function applyFilterChange() {
    currentPage = 1;
    render();
  }
  const debouncedFilterChange = debounce(applyFilterChange, 150);

  document.getElementById("search").addEventListener("input", debouncedFilterChange);
  document.getElementById("yearFrom").addEventListener("input", debouncedFilterChange);
  document.getElementById("yearTo").addEventListener("input", debouncedFilterChange);

  document.getElementById("pageSize").addEventListener("change", (e) => {
    pageSize = parseInt(e.target.value);
    applyFilterChange();
  });

  document.getElementById("filterToggle").addEventListener("click", (btn) => {
    document.getElementById("filterPanel").classList.toggle("open");
    document.getElementById("filterToggle").classList.toggle("active");
  });

  document.getElementById("clearFilters").addEventListener("click", () => {
    selectedAuthors.clear();
    selectedInstitutions.clear();
    document.getElementById("authorChips").innerHTML = "";
    document.getElementById("institutionChips").innerHTML = "";
    document.getElementById("yearFrom").value = "";
    document.getElementById("yearTo").value = "";
    applyFilterChange();
  });

  // Clicking the magnifying glass runs the search immediately, skipping the
  // debounce delay — handy on mobile or after pasting a term into the box.
  document.getElementById("searchIconBtn").addEventListener("click", () => {
    applyFilterChange();
  });

  // Generic searchable multi-select: shows chips for selected values, a text input
  // with a filtered dropdown of remaining options, and click-outside-to-close behaviour.
  function buildMultiselect(inputId, dropdownId, chipsId, optionsList, selectedSet) {
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    const chipsEl = document.getElementById(chipsId);

    function renderChips() {
      chipsEl.innerHTML = [...selectedSet].map(v => `
        <span class="chip">${v}<button type="button" data-value="${v}">&times;</button></span>
      `).join("");
      chipsEl.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedSet.delete(btn.dataset.value);
          renderChips();
          applyFilterChange();
        });
      });
    }

    function renderDropdown(query) {
      const q = query.toLowerCase();
      const matches = optionsList
        .filter(o => !selectedSet.has(o) && o.toLowerCase().includes(q))
        .slice(0, 50);
      dropdown.innerHTML = matches.length
        ? matches.map(o => `<div class="option" data-value="${o}">${o}</div>`).join("")
        : `<div class="no-results">No matches</div>`;
      dropdown.querySelectorAll(".option").forEach(opt => {
        opt.addEventListener("click", () => {
          selectedSet.add(opt.dataset.value);
          input.value = "";
          dropdown.classList.remove("open");
          renderChips();
          applyFilterChange();
        });
      });
    }

    input.addEventListener("focus", () => {
      renderDropdown(input.value);
      dropdown.classList.add("open");
    });
    input.addEventListener("input", () => {
      renderDropdown(input.value);
      dropdown.classList.add("open");
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(`#${inputId}`) && !e.target.closest(`#${dropdownId}`)) {
        dropdown.classList.remove("open");
      }
    });

    renderChips();
  }

  // Escapes regex special characters so the raw search text can be used safely in a RegExp
  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  // Wraps every case-insensitive match of `query` in a <mark> tag, applied per-field
  // (never to the already-built HTML string) so highlighting can't land inside a tag like <em>
  function highlightMatch(text, query) {
    if (!text) return "";
    if (!query) return text;
    const re = new RegExp(escapeRegExp(query), "gi");
    return text.replace(re, (m) => `<mark>${m}</mark>`);
  }

  // Formats a row into an IEEE-style reference string from its structured fields.
  // Authors are stored ";"-separated for reliable filtering, but displayed comma-separated.
  function formatIEEE(p, query) {
    let ref = "";
    if (p.authorList.length) ref += `${highlightMatch(p.authorList.join(", "), query)}, `;
    if (p.title) ref += `"${highlightMatch(p.title, query)}," `;
    if (p.journal) ref += `<em>${highlightMatch(p.journal, query)}</em>`;
    if (p.volume) ref += `, vol. ${p.volume}`;
    if (p.issue) ref += `, no. ${p.issue}`;
    if (p.pages) ref += `, pp. ${p.pages}`;
    if (p.year) ref += `, ${highlightMatch(String(p.year), query)}`;
    ref += ".";
    return ref;
  }

  function render() {
    const rawQuery = document.getElementById("search").value;
    const q = rawQuery.toLowerCase();
    const yearFrom = parseInt(document.getElementById("yearFrom").value) || null;
    const yearTo = parseInt(document.getElementById("yearTo").value) || null;

    let list = papers.filter(p => {
      const matchesSearch = !q || p.searchText.includes(q);
      const yearVal = parseInt(p.year) || 0;
      const matchesYearFrom = !yearFrom || yearVal >= yearFrom;
      const matchesYearTo = !yearTo || yearVal <= yearTo;
      const matchesAuthor = selectedAuthors.size === 0 || p.authorList.some(a => selectedAuthors.has(a));
      const matchesInstitution = selectedInstitutions.size === 0 || p.institutionList.some(i => selectedInstitutions.has(i));
      return matchesSearch && matchesYearFrom && matchesYearTo && matchesAuthor && matchesInstitution;
    });

    list.sort((a, b) => {
      let va = (a[sortKey] || "").toString().toLowerCase();
      let vb = (b[sortKey] || "").toString().toLowerCase();
      if (sortKey === "year") { va = parseInt(va) || 0; vb = parseInt(vb) || 0; }
      if (va < vb) return sortDir === "asc" ? -1 : 1;
      if (va > vb) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    document.getElementById("count").textContent =
      `${list.length} paper${list.length === 1 ? "" : "s"}`;

    const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    const startIdx = (currentPage - 1) * pageSize;
    const pageItems = list.slice(startIdx, startIdx + pageSize);

    document.getElementById("results").innerHTML = pageItems.length
      ? pageItems.map(p => {
          // Routing through Google's viewer (rather than linking to the PDF directly)
          // works around the frame-embedding restrictions most PDF hosts send by default.
          const viewerUrl = p.pdf_url
            ? `https://docs.google.com/viewer?url=${encodeURIComponent(p.pdf_url)}&embedded=true`
            : "";
          return `
        <div class="paper ${p.pdf_url ? "has-pdf" : ""}">
          <p class="paper-ref">${formatIEEE(p, rawQuery)}</p>
          ${p.pdf_url ? `<p class="paper-hint">Click to preview PDF</p>` : ""}
          <div class="paper-links">
            ${p.pdf_url ? `<a href="${p.pdf_url}" target="_blank" rel="noopener">Host link</a>` : ""}
          </div>
          <div class="paper-footer">
            ${p.tags.length ? `<div class="paper-tags">${p.tags.map(t => `<span>${t}</span>`).join("")}</div>` : "<span></span>"}
            ${p.doi ? `<a class="paper-doi" href="https://doi.org/${p.doi}" target="_blank" rel="noopener">DOI: ${p.doi}</a>` : ""}
          </div>
          ${p.pdf_url ? `
            <div class="paper-pdf">
              <iframe data-src="${viewerUrl}" title="PDF preview"></iframe>
            </div>
          ` : ""}
        </div>
      `;
        }).join("")
      : '<div class="empty">No papers match your search.</div>';

    renderPagination(totalPages);
  }

  // Draws Prev/Next + "Page X of Y" and wires up navigation. Clicking these
  // only changes currentPage and re-renders — it does not touch any filter.
  function renderPagination(totalPages) {
    const el = document.getElementById("pagination");
    if (totalPages <= 1) {
      el.innerHTML = "";
      return;
    }
    el.innerHTML = `
      <button class="page-btn" id="prevPage" ${currentPage === 1 ? "disabled" : ""}>&larr; Prev</button>
      <span class="page-info">Page ${currentPage} of ${totalPages}</span>
      <button class="page-btn" id="nextPage" ${currentPage === totalPages ? "disabled" : ""}>Next &rarr;</button>
    `;
    document.getElementById("prevPage").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        render();
        document.querySelector(".wrap").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
    document.getElementById("nextPage").addEventListener("click", () => {
      if (currentPage < totalPages) {
        currentPage++;
        render();
        document.querySelector(".wrap").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  }

  // Click a paper box (but not a link inside it) to expand/collapse its PDF preview
  document.getElementById("results").addEventListener("click", (e) => {
    if (e.target.closest("a")) return; // let DOI/host links behave normally

    const paperEl = e.target.closest(".paper.has-pdf");
    if (!paperEl) return;

    const isOpen = paperEl.classList.toggle("expanded");
    if (isOpen) {
      const iframe = paperEl.querySelector(".paper-pdf iframe");
      if (iframe && !iframe.src) iframe.src = iframe.dataset.src;
    }
  });
</script>
</body>
</html>
