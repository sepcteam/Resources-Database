<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --accent: #36b3ff;
    --accent-dark: #1a8fd6;
    --text: #1c1c1c;
    --muted: #6b7280;
    --border: #dcdde0;
    --page-bg: #ececee;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: #ffffff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  header img {
    height: 34px;
    display: block;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }

  #search {
    flex: 1 1 260px;
    padding: 11px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: var(--card-bg);
    transition: border-color 0.15s ease;
  }

  #search:focus {
    border-color: var(--accent);
  }

  .filter-toggle-btn {
    padding: 9px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .filter-toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .filter-toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 260px;
  }

  .search-wrap #search {
    width: 100%;
    padding-left: 40px;
  }

  .search-icon-btn {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-icon-btn:hover {
    color: var(--accent-dark);
  }

  .search-icon-btn svg {
    width: 17px;
    height: 17px;
  }

  .filter-panel {
    display: none;
    flex-direction: column;
    gap: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 24px;
  }

  .filter-panel.open {
    display: flex;
  }

  .filter-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .year-range {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .year-range input[type="number"] {
    width: 110px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .year-range input[type="number"]:focus {
    border-color: var(--accent);
  }

  .year-range span {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .multiselect {
    position: relative;
  }

  .multiselect-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .multiselect-chips .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #eaf7ff;
    color: var(--accent-dark);
    font-size: 0.8rem;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
  }

  .multiselect-chips .chip button {
    background: none;
    border: none;
    color: var(--accent-dark);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0 2px;
  }

  .multiselect input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .multiselect input[type="text"]:focus {
    border-color: var(--accent);
  }

  .multiselect-dropdown {
    display: none;
    position: absolute;
    z-index: 20;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    max-height: 220px;
    overflow-y: auto;
  }

  .multiselect-dropdown.open {
    display: block;
  }

  .multiselect-dropdown .option {
    padding: 8px 12px;
    font-size: 0.87rem;
    cursor: pointer;
  }

  .multiselect-dropdown .option:hover {
    background: #f3f9ff;
  }

  .multiselect-dropdown .no-results {
    padding: 8px 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .clear-filters-btn {
    align-self: flex-start;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
  }

  .clear-filters-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .count {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .page-size-label {
    color: var(--muted);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .page-size-label select {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 4px 8px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 24px;
  }

  .pagination .page-btn {
    padding: 8px 16px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pagination .page-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .pagination .page-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .pagination .page-info {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .paper {
    background: var(--card-bg);
    padding: 18px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }

  .paper.has-pdf {
    cursor: pointer;
  }

  .paper.has-pdf:hover {
    border-color: var(--accent);
  }

  .paper-ref {
    font-size: 0.98rem;
    margin: 0 0 10px;
    color: var(--text);
  }

  .paper-ref em {
    font-style: italic;
  }

  .paper-ref mark {
    background: rgba(54, 179, 255, 0.28);
    color: var(--accent-dark);
    font-weight: 600;
    border-radius: 3px;
    padding: 0 1px;
  }

  .paper-hint {
    font-size: 0.75rem;
    color: var(--accent-dark);
    margin: 0 0 10px;
  }

  .paper-pdf {
    display: none;
    margin-top: 14px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .paper.expanded .paper-pdf {
    display: block;
  }

  .paper-pdf iframe {
    width: 100%;
    height: 600px;
    border: none;
    display: block;
  }

  .paper-links a {
    color: var(--accent-dark);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    margin-right: 16px;
  }

  .paper-links a:hover {
    text-decoration: underline;
  }

  .paper-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .paper-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .paper-tags span {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--accent-dark);
    background: #eaf7ff;
    padding: 2px 9px;
    border-radius: 999px;
  }

  .paper-doi {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--accent-dark);
    text-decoration: none;
    white-space: nowrap;
    margin-left: auto;
  }

  .paper-doi:hover {
    text-decoration: underline;
  }

  .empty {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }

  .loading {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }
</style>
</head>

<body>

<header>
  <img src="SEPC.png" alt="SEPC logo">
</header>

<div class="wrap">

  <h1>Paper Database</h1>

  <p class="subtitle">
    Search and browse papers, linked to DOI and host pages.
  </p>

  <div class="controls">

    <div class="search-wrap">

      <button
        class="search-icon-btn"
        id="searchIconBtn"
        type="button"
        aria-label="Search"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <input
        type="search"
        id="search"
        placeholder="Search title, author, keyword…"
      >

    </div>

    <button class="filter-toggle-btn" id="filterToggle">
      Filters
    </button>

  </div>

  <div class="filter-panel" id="filterPanel">

    <div class="filter-group">

      <label>Year range</label>

      <div class="year-range">

        <input
          type="number"
          id="yearFrom"
          placeholder="From"
          min="0"
          step="1"
          inputmode="numeric"
        >

        <span>&ndash;</span>

        <input
          type="number"
          id="yearTo"
          placeholder="To"
          min="0"
          step="1"
          inputmode="numeric"
        >

      </div>

    </div>

    <div class="filter-group">

      <label>Author</label>

      <div class="multiselect">

        <div
          class="multiselect-chips"
          id="authorChips"
        ></div>

        <input
          type="text"
          id="authorSearch"
          placeholder="Search authors…"
          autocomplete="off"
        >

        <div
          class="multiselect-dropdown"
          id="authorDropdown"
        ></div>

      </div>

    </div>

    <div class="filter-group">

      <label>Institution</label>

      <div class="multiselect">

        <div
          class="multiselect-chips"
          id="institutionChips"
        ></div>

        <input
          type="text"
          id="institutionSearch"
          placeholder="Search institutions…"
          autocomplete="off"
        >

        <div
          class="multiselect-dropdown"
          id="institutionDropdown"
        ></div>

      </div>

    </div>

    <button
      class="clear-filters-btn"
      id="clearFilters"
    >
      Clear all filters
    </button>

  </div>

  <div class="count-row">

    <div class="count" id="count"></div>

    <label class="page-size-label">

      Show

      <select id="pageSize">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
      </select>

      per page

    </label>

  </div>

  <div id="results">
    <div class="loading">Loading papers…</div>
  </div>

  <div
    class="pagination"
    id="pagination"
  ></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

  const CSV_URL = "Papers.csv";

  let papers = [];

  let sortKey = "year";
  let sortDir = "desc";

  let currentPage = 1;
  let pageSize = 50;

  const selectedAuthors = new Set();
  const selectedInstitutions = new Set();

  /*
   * Cache the currently filtered/sorted list.
   *
   * This is one of the important performance changes.
   *
   * Previously, clicking Prev/Next caused the entire filtering
   * and sorting process to happen again.
   *
   * Now filtering only happens when a filter actually changes.
   */
  let filteredPapers = [];

  /*
   * Cache the current filter state.
   *
   * If render() is called simply because the page changed,
   * we don't need to run the filters again.
   */
  let lastFilterState = null;


  /*
   * ---------------------------------------------------------
   * LOAD CSV
   * ---------------------------------------------------------
   */

  Papa.parse(CSV_URL, {

    download: true,

    header: true,

    skipEmptyLines: true,

    complete: (r) => {

      papers = r.data.map(p => {

        /*
         * Convert everything we need once during loading.
         *
         * This avoids repeatedly converting strings/numbers
         * every time the user searches.
         */

        const authorList = String(p.authors || "")
          .split(";")
          .map(s => s.trim())
          .filter(Boolean);

        const institutionList = String(p.institution || "")
          .split(";")
          .map(s => s.trim())
          .filter(Boolean);

        const tags = String(p.tags || "")
          .split(";")
          .map(s => s.trim())
          .filter(Boolean);

        const yearNumber = parseInt(p.year, 10) || 0;

        /*
         * Build exactly the searchable text we need.
         *
         * This is much cheaper than:
         *
         * Object.values(withLists).join(...)
         *
         * because that also includes the derived arrays and
         * other properties.
         */

        const searchText = [
          p.title,
          p.authors,
          p.institution,
          p.year,
          p.tags,
          p.doi,
          p.journal,
          p.volume,
          p.issue,
          p.pages
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return {
          ...p,
          authorList,
          institutionList,
          tags,
          yearNumber,
          searchText
        };

      });


      /*
       * -------------------------------------------------------
       * BUILD AUTHOR / INSTITUTION LISTS
       * -------------------------------------------------------
       *
       * All options are still kept.
       *
       * There is deliberately NO .slice(0, 50) here.
       */

      const authors = [
        ...new Set(
          papers.flatMap(p => p.authorList)
        )
      ].sort((a, b) =>
        a.localeCompare(b)
      );

      const institutions = [
        ...new Set(
          papers.flatMap(p => p.institutionList)
        )
      ].sort((a, b) =>
        a.localeCompare(b)
      );


      buildMultiselect(
        "authorSearch",
        "authorDropdown",
        "authorChips",
        authors,
        selectedAuthors
      );

      buildMultiselect(
        "institutionSearch",
        "institutionDropdown",
        "institutionChips",
        institutions,
        selectedInstitutions
      );


      /*
       * Initial render.
       */

      applyFilterChange();

    },

    error: () => {

      document.getElementById("results").innerHTML =
        '<div class="empty">Could not load papers.csv — check the file exists in the same folder with this exact name and case.</div>';

    }

  });


  /*
   * ---------------------------------------------------------
   * DEBOUNCE
   * ---------------------------------------------------------
   *
   * Wait until the user pauses typing before filtering.
   *
   * 250 ms is enough to prevent a filter/render cycle from
   * happening for every individual keystroke.
   */

  function debounce(fn, delay) {

    let timer;

    return function (...args) {

      clearTimeout(timer);

      timer = setTimeout(() => {

        fn.apply(this, args);

      }, delay);

    };

  }


  const debouncedFilterChange =
    debounce(applyFilterChange, 250);


  /*
   * ---------------------------------------------------------
   * FILTER CHANGE
   * ---------------------------------------------------------
   */

  function applyFilterChange() {

    currentPage = 1;

    /*
     * Force the filtering stage to run.
     */

    lastFilterState = null;

    render();

  }


  /*
   * ---------------------------------------------------------
   * EVENT LISTENERS
   * ---------------------------------------------------------
   */

  document
    .getElementById("search")
    .addEventListener(
      "input",
      debouncedFilterChange
    );


  /*
   * Year inputs.
   *
   * Only allow digits.
   * Prevent negative values.
   */

  function sanitizeYearInput(input) {

    let value = input.value;

    value = value.replace(/[^\d]/g, "");

    /*
     * Remove leading zeroes while preserving a single zero.
     */

    if (value.length > 1) {

      value = value.replace(/^0+/, "");

      if (value === "") {
        value = "0";
      }

    }

    input.value = value;

  }


  document
    .getElementById("yearFrom")
    .addEventListener("input", function () {

      sanitizeYearInput(this);

      debouncedFilterChange();

    });


  document
    .getElementById("yearTo")
    .addEventListener("input", function () {

      sanitizeYearInput(this);

      debouncedFilterChange();

    });


  /*
   * Page size.
   */

  document
    .getElementById("pageSize")
    .addEventListener("change", (e) => {

      pageSize = parseInt(e.target.value, 10);

      currentPage = 1;

      /*
       * No need to refilter.
       *
       * The underlying filtered list has not changed.
       */

      renderResults();

    });


  /*
   * Filter panel toggle.
   */

  document
    .getElementById("filterToggle")
    .addEventListener("click", () => {

      document
        .getElementById("filterPanel")
        .classList.toggle("open");

      document
        .getElementById("filterToggle")
        .classList.toggle("active");

    });


  /*
   * Clear filters.
   */

  document
    .getElementById("clearFilters")
    .addEventListener("click", () => {

      selectedAuthors.clear();

      selectedInstitutions.clear();

      document.getElementById("authorSearch").value = "";
      document.getElementById("institutionSearch").value = "";

      document.getElementById("authorChips").innerHTML = "";
      document.getElementById("institutionChips").innerHTML = "";

      document.getElementById("yearFrom").value = "";
      document.getElementById("yearTo").value = "";

      applyFilterChange();

    });


  /*
   * Search icon.
   *
   * Run immediately instead of waiting for debounce.
   */

  document
    .getElementById("searchIconBtn")
    .addEventListener("click", () => {

      applyFilterChange();

    });


  /*
   * ---------------------------------------------------------
   * MULTISELECT
   * ---------------------------------------------------------
   */

  function buildMultiselect(
    inputId,
    dropdownId,
    chipsId,
    optionsList,
    selectedSet
  ) {

    const input =
      document.getElementById(inputId);

    const dropdown =
      document.getElementById(dropdownId);

    const chipsEl =
      document.getElementById(chipsId);


    /*
     * Render selected chips.
     *
     * Event delegation is used instead of adding an event
     * listener to every chip button individually.
     */

    function renderChips() {

      chipsEl.innerHTML = [
        ...selectedSet
      ]
        .map(v => `
          <span class="chip">
            ${escapeHtml(v)}
            <button
              type="button"
              data-value="${escapeHtml(v)}"
              aria-label="Remove ${escapeHtml(v)}"
            >
              &times;
            </button>
          </span>
        `)
        .join("");

    }


    /*
     * Render dropdown.
     *
     * IMPORTANT:
     *
     * This still makes ALL matching options available.
     *
     * We are not limiting the list to 50.
     *
     * The dropdown remains scrollable exactly as requested.
     */

    function renderDropdown(query) {

      const q = query.toLowerCase();

      const matches = optionsList.filter(o =>
        !selectedSet.has(o) &&
        o.toLowerCase().includes(q)
      );


      dropdown.innerHTML = matches.length

        ? matches
            .map(o => `
              <div
                class="option"
                data-value="${escapeHtml(o)}"
              >
                ${escapeHtml(o)}
              </div>
            `)
            .join("")

        : `<div class="no-results">No matches</div>`;

    }


    /*
     * One click listener for all chips.
     */

    chipsEl.addEventListener("click", (e) => {

      const btn =
        e.target.closest("button[data-value]");

      if (!btn) return;

      selectedSet.delete(
        btn.dataset.value
      );

      renderChips();

      applyFilterChange();

    });


    /*
     * One click listener for the entire dropdown.
     *
     * This is considerably cheaper than creating a new
     * event listener for every option every time the list
     * changes.
     */

    dropdown.addEventListener("click", (e) => {

      const option =
        e.target.closest(".option");

      if (!option) return;

      selectedSet.add(
        option.dataset.value
      );

      input.value = "";

      dropdown.classList.remove("open");

      renderChips();

      applyFilterChange();

    });


    input.addEventListener("focus", () => {

      renderDropdown(input.value);

      dropdown.classList.add("open");

    });


    input.addEventListener("input", () => {

      renderDropdown(input.value);

      dropdown.classList.add("open");

    });


    /*
     * Click outside to close.
     */

    document.addEventListener("click", (e) => {

      if (
        !e.target.closest(`#${inputId}`) &&
        !e.target.closest(`#${dropdownId}`)
      ) {

        dropdown.classList.remove("open");

      }

    });


    renderChips();

  }


  /*
   * ---------------------------------------------------------
   * HTML ESCAPING
   * ---------------------------------------------------------
   *
   * Keeps CSV values from being interpreted as HTML.
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * ---------------------------------------------------------
   * REGEX ESCAPING
   * ---------------------------------------------------------
   */

  function escapeRegExp(str) {

    return str.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

  }


  /*
   * ---------------------------------------------------------
   * SEARCH HIGHLIGHTING
   * ---------------------------------------------------------
   */

  function highlightMatch(text, query) {

    if (!text) return "";

    if (!query) {
      return escapeHtml(text);
    }

    const safeText =
      escapeHtml(text);

    const safeQuery =
      escapeRegExp(query);

    const re =
      new RegExp(safeQuery, "gi");

    return safeText.replace(
      re,
      (m) => `<mark>${m}</mark>`
    );

  }


  /*
   * ---------------------------------------------------------
   * IEEE REFERENCE FORMAT
   * ---------------------------------------------------------
   */

  function formatIEEE(p, query) {

    let ref = "";


    if (p.authorList.length) {

      ref +=
        `${highlightMatch(
          p.authorList.join(", "),
          query
        )}, `;

    }


    if (p.title) {

      ref +=
        `"${highlightMatch(
          p.title,
          query
        )}," `;

    }


    if (p.journal) {

      ref +=
        `<em>${highlightMatch(
          p.journal,
          query
        )}</em>`;

    }


    if (p.volume) {

      ref +=
        `, vol. ${escapeHtml(p.volume)}`;

    }


    if (p.issue) {

      ref +=
        `, no. ${escapeHtml(p.issue)}`;

    }


    if (p.pages) {

      ref +=
        `, pp. ${escapeHtml(p.pages)}`;

    }


    if (p.year) {

      ref +=
        `, ${highlightMatch(
          String(p.year),
          query
        )}`;

    }


    ref += ".";

    return ref;

  }


  /*
   * ---------------------------------------------------------
   * GET FILTER STATE
   * ---------------------------------------------------------
   */

  function getFilterState() {

    const search =
      document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const yearFromRaw =
      document
        .getElementById("yearFrom")
        .value;

    const yearToRaw =
      document
        .getElementById("yearTo")
        .value;


    /*
     * Empty is different from 0.
     *
     * This is important because year 0 should remain valid.
     */

    const yearFrom =
      yearFromRaw === ""
        ? null
        : parseInt(yearFromRaw, 10);


    const yearTo =
      yearToRaw === ""
        ? null
        : parseInt(yearToRaw, 10);


    return {

      search,

      yearFrom,

      yearTo,

      authors:
        [...selectedAuthors].sort(),

      institutions:
        [...selectedInstitutions].sort()

    };

  }


  /*
   * ---------------------------------------------------------
   * CHECK WHETHER FILTER STATE CHANGED
   * ---------------------------------------------------------
   */

  function filterStateEqual(a, b) {

    if (!a || !b) {
      return false;
    }


    if (a.search !== b.search) {
      return false;
    }


    if (a.yearFrom !== b.yearFrom) {
      return false;
    }


    if (a.yearTo !== b.yearTo) {
      return false;
    }


    if (
      a.authors.length !==
      b.authors.length
    ) {
      return false;
    }


    if (
      a.institutions.length !==
      b.institutions.length
    ) {
      return false;
    }


    for (
      let i = 0;
      i < a.authors.length;
      i++
    ) {

      if (
        a.authors[i] !==
        b.authors[i]
      ) {
        return false;
      }

    }


    for (
      let i = 0;
      i < a.institutions.length;
      i++
    ) {

      if (
        a.institutions[i] !==
        b.institutions[i]
      ) {
        return false;
      }

    }


    return true;

  }


  /*
   * ---------------------------------------------------------
   * FILTER PAPERS
   * ---------------------------------------------------------
   *
   * This is now separate from rendering.
   *
   * It only runs when the actual filter state changes.
   */

  function filterPapers() {

    const state =
      getFilterState();


    if (
      filterStateEqual(
        state,
        lastFilterState
      )
    ) {

      return;

    }


    lastFilterState = state;


    const {
      search,
      yearFrom,
      yearTo,
      authors,
      institutions
    } = state;


    const authorSet =
      new Set(authors);

    const institutionSet =
      new Set(institutions);


    filteredPapers =
      papers.filter(p => {


        /*
         * Search
         */

        if (
          search &&
          !p.searchText.includes(search)
        ) {

          return false;

        }


        /*
         * Year
         */

        if (
          yearFrom !== null &&
          p.yearNumber < yearFrom
        ) {

          return false;

        }


        if (
          yearTo !== null &&
          p.yearNumber > yearTo
        ) {

          return false;

        }


        /*
         * Author
         */

        if (
          authorSet.size > 0 &&
          !p.authorList.some(
            author =>
              authorSet.has(author)
          )
        ) {

          return false;

        }


        /*
         * Institution
         */

        if (
          institutionSet.size > 0 &&
          !p.institutionList.some(
            institution =>
              institutionSet.has(institution)
          )
        ) {

          return false;

        }


        return true;

      });


    /*
     * Sort ONLY when the filtered list changes.
     *
     * Pagination does not cause this sort to run again.
     */

    filteredPapers.sort(
      (a, b) => {

        let va;
        let vb;


        if (sortKey === "year") {

          va = a.yearNumber;
          vb = b.yearNumber;

        } else {

          va =
            String(
              a[sortKey] || ""
            ).toLowerCase();

          vb =
            String(
              b[sortKey] || ""
            ).toLowerCase();

        }


        if (va < vb) {

          return sortDir === "asc"
            ? -1
            : 1;

        }


        if (va > vb) {

          return sortDir === "asc"
            ? 1
            : -1;

        }


        return 0;

      }
    );

  }


  /*
   * ---------------------------------------------------------
   * MAIN RENDER
   * ---------------------------------------------------------
   */

  function render() {

    /*
     * Only run the expensive filtering/sorting stage
     * when the filters have actually changed.
     */

    filterPapers();

    renderResults();

  }


  /*
   * ---------------------------------------------------------
   * RENDER RESULTS
   * ---------------------------------------------------------
   *
   * Only the current page is converted into HTML.
   */

  function renderResults() {

    const rawQuery =
      document
        .getElementById("search")
        .value
        .trim();


    const countEl =
      document.getElementById("count");


    countEl.textContent =
      `${filteredPapers.length} paper${
        filteredPapers.length === 1
          ? ""
          : "s"
      }`;


    const totalPages =
      Math.max(
        1,
        Math.ceil(
          filteredPapers.length /
          pageSize
        )
      );


    if (
      currentPage >
      totalPages
    ) {

      currentPage =
        totalPages;

    }


    const startIdx =
      (currentPage - 1) *
      pageSize;


    const pageItems =
      filteredPapers.slice(
        startIdx,
        startIdx + pageSize
      );


    const resultsEl =
      document.getElementById("results");


    if (!pageItems.length) {

      resultsEl.innerHTML =
        '<div class="empty">No papers match your search.</div>';

      renderPagination(
        totalPages
      );

      return;

    }


    /*
     * Build only the visible page.
     */

    resultsEl.innerHTML =
      pageItems
        .map(p => {


          const viewerUrl =
            p.pdf_url
              ? `https://docs.google.com/viewer?url=${encodeURIComponent(
                  p.pdf_url
                )}&embedded=true`
              : "";


          const tagsHtml =
            p.tags.length

              ? `
                <div class="paper-tags">
                  ${p.tags
                    .map(
                      t =>
                        `<span>${escapeHtml(t)}</span>`
                    )
                    .join("")}
                </div>
              `

              : "<span></span>";


          const pdfHtml =
            p.pdf_url

              ? `
                <div class="paper-pdf">
                  <iframe
                    data-src="${escapeHtml(viewerUrl)}"
                    title="PDF preview"
                  ></iframe>
                </div>
              `

              : "";


          return `

            <div
              class="paper ${
                p.pdf_url
                  ? "has-pdf"
                  : ""
              }"
            >

              <p class="paper-ref">
                ${formatIEEE(
                  p,
                  rawQuery
                )}
              </p>


              ${
                p.pdf_url

                  ? `
                    <p class="paper-hint">
                      Click to preview PDF
                    </p>
                  `

                  : ""
              }


              <div class="paper-links">

                ${
                  p.pdf_url

                    ? `
                      <a
                        href="${escapeHtml(p.pdf_url)}"
                        target="_blank"
                        rel="noopener"
                      >
                        Host link
                      </a>
                    `

                    : ""
                }

              </div>


              <div class="paper-footer">

                ${tagsHtml}


                ${
                  p.doi

                    ? `
                      <a
                        class="paper-doi"
                        href="https://doi.org/${encodeURIComponent(
                          p.doi
                        )}"
                        target="_blank"
                        rel="noopener"
                      >
                        DOI: ${escapeHtml(p.doi)}
                      </a>
                    `

                    : ""
                }

              </div>


              ${pdfHtml}

            </div>

          `;

        })
        .join("");


    renderPagination(
      totalPages
    );

  }


  /*
   * ---------------------------------------------------------
   * PAGINATION
   * ---------------------------------------------------------
   */

  function renderPagination(
    totalPages
  ) {

    const el =
      document.getElementById(
        "pagination"
      );


    if (totalPages <= 1) {

      el.innerHTML = "";

      return;

    }


    el.innerHTML = `

      <button
        class="page-btn"
        id="prevPage"
        ${
          currentPage === 1
            ? "disabled"
            : ""
        }
      >
        &larr; Prev
      </button>


      <span class="page-info">
        Page ${currentPage} of ${totalPages}
      </span>


      <button
        class="page-btn"
        id="nextPage"
        ${
          currentPage === totalPages
            ? "disabled"
            : ""
        }
      >
        Next &rarr;
      </button>

    `;


    document
      .getElementById("prevPage")
      .addEventListener(
        "click",
        () => {

          if (
            currentPage > 1
          ) {

            currentPage--;

            /*
             * IMPORTANT:
             *
             * render() is still safe here because
             * filterPapers() sees that the filter state
             * hasn't changed and immediately returns.
             */

            render();

            document
              .querySelector(".wrap")
              .scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

          }

        }
      );


    document
      .getElementById("nextPage")
      .addEventListener(
        "click",
        () => {

          if (
            currentPage <
            totalPages
          ) {

            currentPage++;

            render();

            document
              .querySelector(".wrap")
              .scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

          }

        }
      );

  }


  /*
   * ---------------------------------------------------------
   * PDF PREVIEW
   * ---------------------------------------------------------
   *
   * Event delegation means we only need ONE click listener
   * for all paper cards.
   */

  document
    .getElementById("results")
    .addEventListener(
      "click",
      (e) => {


        /*
         * Don't intercept DOI/host links.
         */

        if (
          e.target.closest("a")
        ) {

          return;

        }


        const paperEl =
          e.target.closest(
            ".paper.has-pdf"
          );


        if (!paperEl) {

          return;

        }


        const isOpen =
          paperEl.classList.toggle(
            "expanded"
          );


        if (isOpen) {

          const iframe =
            paperEl.querySelector(
              ".paper-pdf iframe"
            );


          /*
           * Lazy-load the PDF viewer.
           *
           * The iframe doesn't actually load until
           * the user opens the paper.
           */

          if (
            iframe &&
            !iframe.src
          ) {

            iframe.src =
              iframe.dataset.src;

          }

        }

      }
    );

</script>

</body>
