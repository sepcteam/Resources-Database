<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papers Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  
  :root {
    --accent: #36b3ff;
    --accent-dark: #1a8fd6;
    --text: #1c1c1c;
    --muted: #6b7280;
    --border: #dcdde0;
    --page-bg: #ececee;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: #ffffff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header img {
    height: 34px;
    display: block;
  }

  .header-title {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header-subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 400;
  }

  .header-nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .header-nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
  }

  .header-nav a:hover {
    color: var(--accent-dark);
  }

  .page-layout {
    display: grid;
    grid-template-columns: minmax(0, 1100px) 280px;
    gap: 24px;
    align-items: start;
  }

  .main-content {
    min-width: 0;
  }

  .filter-sidebar {
    min-width: 0;
  }

  .filter-sidebar .filter-panel {
    margin-bottom: 0;
  }

  @media (max-width: 960px) {
    .page-layout {
      grid-template-columns: 1fr;
    }

    .filter-sidebar {
      order: -1;
    }

    .filter-sidebar .filter-panel {
      position: static;
    }
  }

  .wrap {
    max-width: 1420px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    transform: translateX(120px);
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    position: relative;
  }

  #search {
    flex: 1 1 260px;
    padding: 11px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: var(--card-bg);
    transition: border-color 0.15s ease;
  }

  #search:focus {
    border-color: var(--accent);
  }

  .filter-toggle-btn {
    padding: 9px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .filter-toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .filter-toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 260px;
  }

  .search-wrap #search {
    width: 100%;
    padding-left: 40px;
  }

  .search-icon-btn {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-icon-btn:hover {
    color: var(--accent-dark);
  }

  .search-icon-btn svg {
    width: 17px;
    height: 17px;
  }

  .filter-panel {
    display: none;
    flex-direction: column;
    gap: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    position: sticky;
    top: 20px;
  }

  .filter-panel.open {
    display: flex;
  }


  .filter-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .year-range {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .year-range input[type="number"] {
    width: 110px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .year-range input[type="number"]:focus {
    border-color: var(--accent);
  }

  .year-range span {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .multiselect {
    position: relative;
  }

  .multiselect-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .multiselect-chips .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #eaf7ff;
    color: var(--accent-dark);
    font-size: 0.8rem;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
  }

  .multiselect-chips .chip button {
    background: none;
    border: none;
    color: var(--accent-dark);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0 2px;
  }

  .multiselect input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }

  .multiselect input[type="text"]:focus {
    border-color: var(--accent);
  }

  .multiselect-dropdown {
    display: none;
    position: static;
    z-index: 20;
    width: 100%;
    margin-top: 4px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    max-height: 220px;
    overflow-y: auto;
  }

  .multiselect-dropdown.open {
    display: block;
  }

  .multiselect-dropdown .option {
    padding: 8px 12px;
    font-size: 0.87rem;
    cursor: pointer;
  }

  .multiselect-dropdown .option:hover {
    background: #f3f9ff;
  }

  .multiselect-dropdown .no-results {
    padding: 8px 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .clear-filters-btn {
    align-self: flex-start;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
  }

  .clear-filters-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .navigation-actions {
  position: absolute;
  right: 100%;          
  top: 50%;
  transform: translateY(-50%);   
  margin-right: 12px;    
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  }
  
.author-profile {
  display: none;
  position: fixed;
  width: 200px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  z-index: 15;
}

.author-profile.visible {
  display: block;
}

.upload-box {
background: transparent !important;
  position: fixed;
  width: 220px;
  min-height: 140px;
  background: transparent !important;
  border: 2px dashed #333;
  border-radius: 10px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  z-index: 15;
  overflow: hidden;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.upload-box.compact .upload-box-hint {
  display: none;
}

.upload-box.tiny {
  padding: 8px;
}

.upload-box.tiny svg {
  display: none;
}

.upload-box.dragover {
  background: #eaf7ff;
  border-color: var(--accent);
}

.upload-box svg {
  width: 32px;
  height: 32px;
  color: var(--muted);
  margin-bottom: 10px;
}

.upload-box-text {
  font-size: 0.85rem;
  font-weight: 500;
}

.upload-box-hint {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.4;
}

.upload-box input[type="file"] {
  display: none;
}

  .navigation-btn {
    padding: 8px 14px;
    font-size: 0.8rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--accent-dark);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .navigation-btn:hover:not(:disabled) {
    
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  

  .navigation-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .paper-access-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 10px;
  }

  .paper-source {
    color: var(--accent-dark);
    font-size: 0.82rem;
  }

  .paper-access-btn {
    display: inline-block;
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--accent-dark);
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    white-space: nowrap;
    transition: all 0.15s ease;
    margin-left: auto;
  }

  .paper-access-btn:hover {
  border-color: var(--accent);
  color: var(--accent-dark);
  text-decoration: none;
}



  .page-size-label {
    color: var(--muted);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .page-size-label select {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 4px 8px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 24px;
  }

  .pagination .page-btn {
    padding: 8px 16px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pagination .page-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .pagination .page-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .pagination .page-info {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .paper {
    background: var(--card-bg);
    padding: 18px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }

  .paper-ref {
    font-size: 0.98rem;
    margin: 0 0 10px;
    color: var(--text);
  }

  
  .paper-ref em {
    font-style: italic;
  }

  .paper mark {
    background: rgba(54, 179, 255, 0.28);
    color: var(--accent-dark);
    font-weight: 600;
    border-radius: 3px;
    padding: 0 1px;
  }

  .paper-institution {
  font-size: 0.82rem;
  color: var(--muted);
  margin: 0 0 10px;
  }
  
  .paper-links a {
    color: var(--accent-dark);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    margin-right: 16px;
  }

  .paper-links a:hover {
    text-decoration: underline;
  }

  .paper-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .paper-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .paper-tags span {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--accent-dark);
    background: #eaf7ff;
    padding: 2px 9px;
    border-radius: 999px;
  }

  .paper-author-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 4px 10px;
    margin-left: auto;
    text-align: right;
  }

  .paper-author {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--accent-dark);
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }

  .paper-author:hover {
    text-decoration: underline;
  }

  .paper-doi {
    display: block;
    width: 100%;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--accent-dark);
    text-decoration: none;
    text-align: right;
    margin-left: auto;
    margin-top: 2px;
  }

  .paper-doi:hover {
    text-decoration: underline;
  }

  .empty {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }

  .loading {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }
  
  .filter-toggle-btn:active,
.clear-filters-btn:active,
.pagination .page-btn:active:not(:disabled),
.navigation-btn:active:not(:disabled),
.paper-access-btn:active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
  

  @media (max-width: 960px) {
    .author-profile {
      position: fixed;
      left: 12px !important;
      right: 12px;
      width: auto;
      top: auto !important;
      bottom: 180px;
    }

    .upload-box {
background: transparent;
      left: 12px !important;
      right: 12px;
      bottom: 20px !important;
      width: auto;
      min-height: 120px;
    }
  }

</style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="SEPC.png" alt="SEPC logo">
    <div class="header-title">Papers Database</div>
    <div class="header-subtitle">Courtesy of the SEPC team</div>
  </div>

  <nav class="header-nav" aria-label="Main navigation">
    <a href="use-and-moderation.html">Use of the site</a>
  </nav>
</header>

<div class="wrap">

  <div class="page-layout">

    <main class="main-content">
      <div class="controls">
        <div class="navigation-actions">
        <button
          class="navigation-btn"
          id="backButton"
          type="button"
          disabled
        >
          &larr; Back
        </button>

        <button
          class="navigation-btn"
          id="backToAll"
          type="button"
        >
          Back to all papers
        </button>
        </div>

        <aside class="author-profile" id="authorProfile">
          <div class="author-profile-name" id="authorProfileName"></div>
          <div class="author-profile-count" id="authorProfileCount"></div>
          
        </aside>

        <div class="search-wrap">

          <button
            class="search-icon-btn"
            id="searchIconBtn"
            type="button"
            aria-label="Search"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>

          <input
            type="search"
            id="search"
            placeholder="Search title, author, keyword…"
          >

        </div>

        <button class="filter-toggle-btn" id="filterToggle">
          Filters
        </button>
      </div>

      

      <div class="count-row">
        <div class="count" id="count"></div>

        <label class="page-size-label">
          Show
          <select id="pageSize">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
          per page
        </label>
      </div>

      <div id="results">
        <div class="loading">Loading papers…</div>
      </div>

      <div
        class="pagination"
        id="pagination"
      ></div>
    </main>

    <aside class="filter-sidebar" aria-label="Paper filters">
      <div class="filter-panel" id="filterPanel">

        <div class="filter-group">
          <label>Year range</label>

          <div class="year-range">
            <input
              type="number"
              id="yearFrom"
              placeholder="From"
              min="0"
              step="1"
              inputmode="numeric"
            >

            <span>&ndash;</span>

            <input
              type="number"
              id="yearTo"
              placeholder="To"
              min="0"
              step="1"
              inputmode="numeric"
            >
          </div>
        </div>

        <div class="filter-group">
          <label>Author</label>

          <div class="multiselect">
            <div
              class="multiselect-chips"
              id="authorChips"
            ></div>

            <input
              type="text"
              id="authorSearch"
              placeholder="Search authors…"
              autocomplete="off"
            >

            <div
              class="multiselect-dropdown"
              id="authorDropdown"
            ></div>
          </div>
        </div>

        <div class="filter-group">
          <label>Institution</label>

          <div class="multiselect">
            <div
              class="multiselect-chips"
              id="institutionChips"
            ></div>

            <input
              type="text"
              id="institutionSearch"
              placeholder="Search institutions…"
              autocomplete="off"
            >

            <div
              class="multiselect-dropdown"
              id="institutionDropdown"
            ></div>
          </div>
        </div>

        <button
          class="clear-filters-btn"
          id="clearFilters"
        >
          Clear all filters
        </button>

      </div>
    </aside>

  </div>

</div>

<div class="upload-box" id="uploadBox">
  <input type="file" id="uploadFileInput" accept="application/pdf" multiple>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 16V4M12 4L7 9M12 4l5 5"></path>
    <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
  </svg>
  <div class="upload-box-text">Click or drag a paper here to submit</div>
  <div class="upload-box-hint">
    Please format the title in IEEE reference style.<br>
    Submissions are reviewed before being added.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

    function positionMarginBoxes() {
    const controlsEl = document.querySelector(".controls");
    if (!controlsEl) return;
  
    const rect = controlsEl.getBoundingClientRect();
  
    const authorProfileEl = document.getElementById("authorProfile");
    if (authorProfileEl) {
      const w = authorProfileEl.offsetWidth || 200;
      const left = Math.max(12, rect.left / 2 - w / 2);
      let top = rect.top;

      const navEl = document.querySelector(".navigation-actions");
      if (navEl) {
        const n = navEl.getBoundingClientRect();
        if (left < n.right && left + w > n.left) {
          top = Math.max(top, n.bottom + 12);
        }
      }

      authorProfileEl.style.left = `${left}px`;
      authorProfileEl.style.top = `${top}px`;
    }
  
    const uploadBoxEl = document.getElementById("uploadBox");
    if (uploadBoxEl) {
      const w = uploadBoxEl.offsetWidth || 220;
      const gapStart = rect.right;
      const gapWidth = window.innerWidth - gapStart;
      uploadBoxEl.style.left = `${Math.max(12, gapStart + gapWidth / 2 - w / 2)}px`;
      uploadBoxEl.style.top = "auto";
      uploadBoxEl.style.bottom = "24px";
    }

    fitUploadBox();
  }

  function fitUploadBox() {
    const box = document.getElementById("uploadBox");
    const panel = document.getElementById("filterPanel");
    if (!box) return;

    box.style.display = "";
    box.style.height = "";
    box.style.minHeight = "";
    box.classList.remove("compact", "tiny");

    if (!panel || !panel.classList.contains("open")) return;

    const gap = 12;
    const p = panel.getBoundingClientRect();
    const b = box.getBoundingClientRect();

    if (p.left >= b.right || p.right <= b.left) return;
    if (p.bottom <= 0 || p.top >= window.innerHeight) return;
    if (p.top >= b.bottom) return;
    if (p.bottom + gap <= b.top) return;

    const available = b.bottom - p.bottom - gap;

    box.style.minHeight = "0";
    box.classList.add("compact");

    if (available >= box.offsetHeight) return;

    box.classList.add("tiny");

    if (available >= box.offsetHeight) return;

    box.style.display = "none";
  }

  let fitFrame = null;

  function scheduleFitUploadBox() {
    if (fitFrame !== null) return;
    fitFrame = requestAnimationFrame(() => {
      fitFrame = null;
      fitUploadBox();
    });
  }

  window.addEventListener("load", positionMarginBoxes);
  window.addEventListener("resize", positionMarginBoxes);
  window.addEventListener("scroll", scheduleFitUploadBox, { passive: true });

  const filterPanelEl = document.getElementById("filterPanel");

  if (window.ResizeObserver && filterPanelEl) {
    new ResizeObserver(scheduleFitUploadBox).observe(filterPanelEl);
  }

  document
    .getElementById("filterToggle")

  const uploadBox = document.getElementById("uploadBox");

  function handleUploadedFiles(fileList) {
    const files = [...fileList];
    if (!files.length) return;
  
    // PLACEHOLDER — there's nowhere for these files to go yet.
    // Once you pick Google Forms or GitHub Issues, this function
    // gets replaced with the real submission logic.
    alert(`Received ${files.length} file(s). Submission handling isn't wired up yet.`);
  }
  
  const CSV_URL = "Papers.csv";

  let papers = [];

  let sortKey = "year";
  let sortDir = "desc";

  let currentPage = 1;
  let pageSize = 50;

  let visibleAuthorProfile = null;
  
  const selectedAuthors = new Set();
  const selectedInstitutions = new Set();

  /*
   * Cache the currently filtered/sorted list.
   *
   * This is one of the important performance changes.
   *
   * Previously, clicking Prev/Next caused the entire filtering
   * and sorting process to happen again.
   *
   * Now filtering only happens when a filter actually changes.
   */
  let filteredPapers = [];

  /*
   * Cache the current filter state.
   *
   * If render() is called simply because the page changed,
   * we don't need to run the filters again.
   */
  let lastFilterState = null;

  /*
   * Navigation history.
   *
   * Each entry stores the complete database view immediately
   * before the latest user action.
   */
  const navigationHistory = [];

  let lastViewSnapshot = null;


  /*
   * ---------------------------------------------------------
   * LOAD CSV
   * ---------------------------------------------------------
   */

  Papa.parse(CSV_URL, {

    download: true,

    header: true,

    skipEmptyLines: true,

    complete: (r) => {

      papers = r.data.map(p => {

        /*
         * Convert everything we need once during loading.
         *
         * This avoids repeatedly converting strings/numbers
         * every time the user searches.
         */

        const authorList = String(p.authors || "")
          .split(";")
          .map(s => s.trim())
          .filter(Boolean);

        const institutionList = String(p.institution || "")
          .split(";")
          .map(s => s.trim())
          .filter(Boolean);

        const tags = String(p.tags || "")
          .split(";")
          .map(s => s.trim())
          .filter(Boolean);

        const yearNumber = parseInt(p.year, 10) || 0;

        /*
         * Build exactly the searchable text we need.
         *
         * This is much cheaper than:
         *
         * Object.values(withLists).join(...)
         *
         * because that also includes the derived arrays and
         * other properties.
         */

        const searchText = [
          p.title,
          p.authors,
          p.institution,
          p.year,
          p.tags,
          p.doi,
          p.source,
          p.journal,
          p.volume,
          p.issue,
          p.pages
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return {
          ...p,
          authorList,
          institutionList,
          tags,
          yearNumber,
          searchText
        };

      });


      /*
       * -------------------------------------------------------
       * BUILD AUTHOR / INSTITUTION LISTS
       * -------------------------------------------------------
       *
       * All options are still kept.
       *
       * There is deliberately NO .slice(0, 50) here.
       */

      const authors = [
        ...new Set(
          papers.flatMap(p => p.authorList)
        )
      ].sort((a, b) =>
        a.localeCompare(b)
      );

      const institutions = [
        ...new Set(
          papers.flatMap(p => p.institutionList)
        )
      ].sort((a, b) =>
        a.localeCompare(b)
      );


      const institutionsByAuthor = new Map();
      const authorsByInstitution = new Map();

      papers.forEach(p => {

        const a = p.authorList;
        const ins = p.institutionList;
        const n = Math.min(a.length, ins.length);

        for (let i = 0; i < n; i++) {

          const author = a[i];
          const institution = ins[i];

          if (!institutionsByAuthor.has(author)) {
            institutionsByAuthor.set(author, new Set());
          }
          institutionsByAuthor.get(author).add(institution);

          if (!authorsByInstitution.has(institution)) {
            authorsByInstitution.set(institution, new Set());
          }
          authorsByInstitution.get(institution).add(author);

        }

      });

      function getAllowedOptions(otherSelected, otherInputId, otherMap) {

        const keys = [];

        if (otherSelected.size > 0) {
          keys.push(...otherSelected);
        } else {
          const text = document
            .getElementById(otherInputId)
            .value
            .trim()
            .toLowerCase();

          if (!text) return null;

          otherMap.forEach((_, key) => {
            if (key.toLowerCase().includes(text)) {
              keys.push(key);
            }
          });
        }

        const allowed = new Set();

        keys.forEach(key => {
          const linked = otherMap.get(key);
          if (linked) {
            linked.forEach(v => allowed.add(v));
          }
        });

        return allowed;

      }

      buildMultiselect(
        "authorSearch",
        "authorDropdown",
        "authorChips",
        authors,
        selectedAuthors,
        () => getAllowedOptions(
          selectedInstitutions,
          "institutionSearch",
          authorsByInstitution
        )
      );

      buildMultiselect(
        "institutionSearch",
        "institutionDropdown",
        "institutionChips",
        institutions,
        selectedInstitutions,
        () => getAllowedOptions(
          selectedAuthors,
          "authorSearch",
          institutionsByAuthor
        )
      );


      /*
       * Initial render.

      applyFilterChange();

    },

    error: () => {

      document.getElementById("results").innerHTML =
        '<div class="empty">Could not load papers.csv — check the file exists in the same folder with this exact name and case.</div>';

    }

  });


  /*
   * ---------------------------------------------------------
   * DEBOUNCE
   * ---------------------------------------------------------
   *
   * Wait until the user pauses typing before filtering.
   *
   * 250 ms is enough to prevent a filter/render cycle from
   * happening for every individual keystroke.
   */

  function debounce(fn, delay) {

    let timer;

    return function (...args) {

      clearTimeout(timer);

      timer = setTimeout(() => {

        fn.apply(this, args);

      }, delay);

    };

  }


  const debouncedFilterChange =
    debounce(applyFilterChange, 250);


  /*
   * ---------------------------------------------------------

  function applyFilterChange() {

     * Save the view that existed immediately before this

  /*

  /*

  function sanitizeYearInput(input) {

    let value = input.value;

    value = value.replace(/[^\d]/g, "");

    /*
     * Remove leading zeroes while preserving a single zero.
     */

    if (value.length > 1) {

      value = value.replace(/^0+/, "");

      if (value === "") {
        value = "0";
      }

    }

    input.value = value;

  }

  /*
   * ---------------------------------------------------------
   * MULTISELECT
   * ---------------------------------------------------------
   */

  function buildMultiselect(
    inputId,
    dropdownId,
    chipsId,
    optionsList,
    selectedSet,
    getAllowed
  ) {

    const input =
      document.getElementById(inputId);

    const dropdown =
      document.getElementById(dropdownId);

    const chipsEl =
      document.getElementById(chipsId);


    /*
     * Render selected chips.
     *
     * Event delegation is used instead of adding an event
     * listener to every chip button individually.
     */

    function renderChips() {

      chipsEl.innerHTML = [
        ...selectedSet
      ]
        .map(v => `
          <span class="chip">
            ${escapeHtml(v)}
            <button
              type="button"
              data-value="${escapeHtml(v)}"
              aria-label="Remove ${escapeHtml(v)}"
            >
              &times;
            </button>
          </span>
        `)
        .join("");

    }


    /*
     * Render dropdown.
     *
     * IMPORTANT:
     *
     * This still makes ALL matching options available.
     *
     * We are not limiting the list to 50.
     *
     * The dropdown remains scrollable exactly as requested.
     */

    function renderDropdown(query) {

      const q = query.toLowerCase();

      const allowed = getAllowed ? getAllowed() : null;

      const matches = optionsList.filter(o =>
        !selectedSet.has(o) &&
        o.toLowerCase().includes(q) &&
        (!allowed || allowed.has(o))
      );


      dropdown.innerHTML = matches.length

        ? matches
            .map(o => `
              <div
                class="option"
                data-value="${escapeHtml(o)}"
              >
                ${escapeHtml(o)}
              </div>
            `)
            .join("")

        : `<div class="no-results">No matches</div>`;

    }


    /*
     * One click listener for all chips.
     */

    chipsEl.addEventListener("click", (e) => {

      const btn =
        e.target.closest("button[data-value]");

      if (!btn) return;

      selectedSet.delete(
        btn.dataset.value
      );

      renderChips();

      applyFilterChange();

    });


    /*
     * One click listener for the entire dropdown.
     *
     * This is considerably cheaper than creating a new
     * event listener for every option every time the list
     * changes.
     */

    dropdown.addEventListener("click", (e) => {

      const option =
        e.target.closest(".option");

      if (!option) return;

      selectedSet.add(
        option.dataset.value
      );

      input.value = "";

      dropdown.classList.remove("open");

      renderChips();

      applyFilterChange();

    });


    input.addEventListener("focus", () => {

      renderDropdown(input.value);

      dropdown.classList.add("open");

    });


    input.addEventListener("input", () => {

      renderDropdown(input.value);

      dropdown.classList.add("open");

    });


    /*
     * Click outside to close.
     */

    document.addEventListener("click", (e) => {

      if (
        !e.target.closest(`#${inputId}`) &&
        !e.target.closest(`#${dropdownId}`)
      ) {

        dropdown.classList.remove("open");

      }

    });


    renderChips();

  }


  /*
   * ---------------------------------------------------------
   * HTML ESCAPING
   * ---------------------------------------------------------
   *
   * Keeps CSV values from being interpreted as HTML.
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * ---------------------------------------------------------
   * REGEX ESCAPING
   * ---------------------------------------------------------
   */

  function escapeRegExp(str) {

    return str.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

  }


  /*
   * ---------------------------------------------------------
   * PAPER SOURCE / HOST
   * ---------------------------------------------------------
   *
   * This is intentionally modular.
   *
   * Preferred method:
   * add a "source" column to the CSV, for example:
   *
   *   source
   *   IEPC
   *   EPS
   *   AIAA
   *
   * If source is blank, IEPC is detected automatically from
   * the journal/title so the existing database continues to
   * work without a CSV change.
   */

  function getPaperSource(p) {

    const explicitSource =
      String(
        p.source ||
        p.Source ||
        ""
      )
      .trim()
      .toLowerCase();


    if (
      explicitSource === "iepc" ||
      explicitSource.includes(
        "international electric propulsion conference"
      )
    ) {

      return {
        key: "iepc",
        label: "Hosted by ERPS"
      };

    }


    const journal =
      String(
        p.journal || ""
      )
      .toLowerCase();


    const title =
      String(
        p.title || ""
      )
      .toLowerCase();


    if (
      journal.includes("iepc") ||
      journal.includes(
        "international electric propulsion conference"
      ) ||
      title.includes("iepc")
    ) {

      return {
        key: "iepc",
        label: "Hosted by ERPS"
      };

    }


    /*
     * Future sources can be added here, for example:
     *
     * if (explicitSource === "eps") {
     *   return {
     *     key: "eps",
     *     label: "Hosted by EPS"
     *   };
     * }
     *
     * if (explicitSource === "aiaa") {
     *   return {
     *     key: "aiaa",
     *     label: "Hosted by AIAA"
     *   };
     * }
     */


    return {
      key: explicitSource || "unknown",
      label: ""
    };

  }


  /*
   * ---------------------------------------------------------
   * SEARCH HIGHLIGHTING
   * ---------------------------------------------------------
   */

  function highlightMatch(text, query) {

    if (!text) return "";

    if (!query) {
      return escapeHtml(text);
    }

    const safeText =
      escapeHtml(text);

    const safeQuery =
      escapeRegExp(query);

    const re =
      new RegExp(safeQuery, "gi");

    return safeText.replace(
      re,
      (m) => `<mark>${m}</mark>`
    );

  }


  /*
   * ---------------------------------------------------------
   * IEEE REFERENCE FORMAT
   * ---------------------------------------------------------
   */

  function formatIEEE(p, query) {

    let ref = "";


    if (p.authorList.length) {

      ref +=
        `${highlightMatch(
          p.authorList.join(", "),
          query
        )}, `;

    }


    if (p.title) {

      ref +=
        `"${highlightMatch(
          p.title,
          query
        )}," `;

    }


    if (p.journal) {

      ref +=
        `<em>${highlightMatch(
          p.journal,
          query
        )}</em>`;

    }


    if (p.volume) {

      ref +=
        `, vol. ${escapeHtml(p.volume)}`;

    }


    if (p.issue) {

      ref +=
        `, no. ${escapeHtml(p.issue)}`;

    }


    if (p.pages) {

      ref +=
        `, pp. ${escapeHtml(p.pages)}`;

    }


    if (p.year) {

      ref +=
        `, ${highlightMatch(
          String(p.year),
          query
        )}`;

    }


    ref += ".";

    return ref;

  }


  /*
   * ---------------------------------------------------------
   * GET FILTER STATE
   * ---------------------------------------------------------
   */

  function getFilterState() {

    const search =
      document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const yearFromRaw =
      document
        .getElementById("yearFrom")
        .value;

    const yearToRaw =
      document
        .getElementById("yearTo")
        .value;


    /*
     * Empty is different from 0.
     *
     * This is important because year 0 should remain valid.
     */

    const yearFrom =
      yearFromRaw === ""
        ? null
        : parseInt(yearFromRaw, 10);


    const yearTo =
      yearToRaw === ""
        ? null
        : parseInt(yearToRaw, 10);


    return {

      search,

      yearFrom,

      yearTo,

      authors:
        [...selectedAuthors].sort(),

      institutions:
        [...selectedInstitutions].sort()

    };

  }


  /*
   * ---------------------------------------------------------
   * CHECK WHETHER FILTER STATE CHANGED
   * ---------------------------------------------------------
   */

  function filterStateEqual(a, b) {

    if (!a || !b) {
      return false;
    }


    if (a.search !== b.search) {
      return false;
    }


    if (a.yearFrom !== b.yearFrom) {
      return false;
    }


    if (a.yearTo !== b.yearTo) {
      return false;
    }


    if (
      a.authors.length !==
      b.authors.length
    ) {
      return false;
    }


    if (
      a.institutions.length !==
      b.institutions.length
    ) {
      return false;
    }


    for (
      let i = 0;
      i < a.authors.length;
      i++
    ) {

      if (
        a.authors[i] !==
        b.authors[i]
      ) {
        return false;
      }

    }


    for (
      let i = 0;
      i < a.institutions.length;
      i++
    ) {

      if (
        a.institutions[i] !==
        b.institutions[i]
      ) {
        return false;
      }

    }


    return true;

  }


  /*
   * ---------------------------------------------------------
   * NAVIGATION HISTORY
   * ---------------------------------------------------------
   */

  function cloneFilterState(state) {

    if (!state) {
      return null;
    }

    return {
      search: state.search,
      yearFrom: state.yearFrom,
      yearTo: state.yearTo,
      authors: [...state.authors],
      institutions: [...state.institutions]
    };

  }


  function getViewSnapshot() {

    return {
      filterState:
        cloneFilterState(
          getFilterState()
        ),

      currentPage,

      pageSize,

      authorProfile: visibleAuthorProfile

    };

  }


  function viewStateEqual(a, b) {

    if (!a || !b) {
      return false;
    }

    if (
      a.currentPage !==
      b.currentPage
    ) {
      return false;
    }

    if (
      a.pageSize !==
      b.pageSize
    ) {
      return false;
    }

    return filterStateEqual(
      a.filterState,
      b.filterState
    );

  }


  function pushCurrentViewToHistory() {

    const currentView =
      getViewSnapshot();

    if (
      !lastViewSnapshot ||
      viewStateEqual(
        lastViewSnapshot,
        currentView
      )
    ) {
      return;
    }

    navigationHistory.push({
      filterState:
        cloneFilterState(
          lastViewSnapshot.filterState
        ),

      currentPage:
        lastViewSnapshot.currentPage,

      pageSize:
        lastViewSnapshot.pageSize

    });

    /*
     * Keep the history bounded so repeated searches cannot
     * grow the page indefinitely.
     */
    if (
      navigationHistory.length > 50
    ) {
      navigationHistory.shift();
    }

    updateNavigationButtons();

  }


  function renderHistoryChips(
    elementId,
    values
  ) {

    const element =
      document.getElementById(
        elementId
      );

    element.innerHTML =
      values
        .map(value => `
          <span class="chip">
            ${escapeHtml(value)}
            <button
              type="button"
              data-value="${escapeHtml(value)}"
              aria-label="Remove ${escapeHtml(value)}"
            >
              &times;
            </button>
          </span>
        `)
        .join("");

  }


  function restoreViewSnapshot(snapshot) {

    selectedAuthors.clear();

    snapshot
      .filterState
      .authors
      .forEach(author =>
        selectedAuthors.add(author)
      );


    selectedInstitutions.clear();

    snapshot
      .filterState
      .institutions
      .forEach(institution =>
        selectedInstitutions.add(institution)
      );


    document.getElementById("search").value =
      snapshot.filterState.search;


    document.getElementById("authorSearch").value =
      "";

    document.getElementById("institutionSearch").value =
      "";


    document.getElementById("yearFrom").value =
      snapshot.filterState.yearFrom === null
        ? ""
        : snapshot.filterState.yearFrom;


    document.getElementById("yearTo").value =
      snapshot.filterState.yearTo === null
        ? ""
        : snapshot.filterState.yearTo;


    renderHistoryChips(
      "authorChips",
      snapshot.filterState.authors
    );

    renderHistoryChips(
      "institutionChips",
      snapshot.filterState.institutions
    );


    pageSize =
      snapshot.pageSize;

    document.getElementById("pageSize").value =
      String(pageSize);


    currentPage =
      snapshot.currentPage;


    lastFilterState = null;

    if (snapshot.authorProfile) {
      showAuthorProfile(snapshot.authorProfile);
    } else {
      hideAuthorProfile();
    }

    render();

  }


  function updateNavigationButtons() {

    const backButton =
      document.getElementById(
        "backButton"
      );

    if (!backButton) {
      return;
    }

    backButton.disabled =
      navigationHistory.length === 0;

  }


  /*
   * ---------------------------------------------------------
   * FILTER PAPERS
   * ---------------------------------------------------------
   *
   * This is now separate from rendering.
   *
   * It only runs when the actual filter state changes.
   */

  function filterPapers() {

    const state =
      getFilterState();


    if (
      filterStateEqual(
        state,
        lastFilterState
      )
    ) {

      return;

    }


    lastFilterState = state;


    const {
      search,
      yearFrom,
      yearTo,
      authors,
      institutions
    } = state;


    const authorSet =
      new Set(authors);

    const institutionSet =
      new Set(institutions);


    filteredPapers =
      papers.filter(p => {


        /*
         * Search
         */

        if (
          search &&
          !p.searchText.includes(search)
        ) {

          return false;

        }


        /*
         * Year
         */

        if (
          yearFrom !== null &&
          p.yearNumber < yearFrom
        ) {

          return false;

        }


        if (
          yearTo !== null &&
          p.yearNumber > yearTo
        ) {

          return false;

        }


        /*
         * Author
         */

        if (
          authorSet.size > 0 &&
          !p.authorList.some(
            author =>
              authorSet.has(author)
          )
        ) {

          return false;

        }


        /*
         * Institution
         */

        if (
          institutionSet.size > 0 &&
          !p.institutionList.some(
            institution =>
              institutionSet.has(institution)
          )
        ) {

          return false;

        }


        return true;

      });


    /*
     * Sort ONLY when the filtered list changes.
     *
     * Pagination does not cause this sort to run again.
     */

    filteredPapers.sort(
      (a, b) => {

        let va;
        let vb;


        if (sortKey === "year") {

          va = a.yearNumber;
          vb = b.yearNumber;

        } else {

          va =
            String(
              a[sortKey] || ""
            ).toLowerCase();

          vb =
            String(
              b[sortKey] || ""
            ).toLowerCase();

        }


        if (va < vb) {

          return sortDir === "asc"
            ? -1
            : 1;

        }


        if (va > vb) {

          return sortDir === "asc"
            ? 1
            : -1;

        }


        return 0;

      }
    );

  }


  /*
   * ---------------------------------------------------------
   * MAIN RENDER
   * ---------------------------------------------------------
   */

  function render() {

    /*
     * Only run the expensive filtering/sorting stage
     * when the filters have actually changed.
     */

    filterPapers();

    renderResults();

    /*
     * The view is now fully rendered, so it becomes the
     * reference point for the next Back action.
     */
    lastViewSnapshot =
      getViewSnapshot();

    updateNavigationButtons();

  }


  /*
   * ---------------------------------------------------------
   * RENDER RESULTS
   * ---------------------------------------------------------
   *
   * Only the current page is converted into HTML.
   */

  function renderResults() {

    const rawQuery =
      document
        .getElementById("search")
        .value
        .trim();


    const countEl =
      document.getElementById("count");


    countEl.textContent =
      `${filteredPapers.length} paper${
        filteredPapers.length === 1
          ? ""
          : "s"
      }`;


    const totalPages =
      Math.max(
        1,
        Math.ceil(
          filteredPapers.length /
          pageSize
        )
      );


    if (
      currentPage >
      totalPages
    ) {

      currentPage =
        totalPages;

    }


    const startIdx =
      (currentPage - 1) *
      pageSize;


    const pageItems =
      filteredPapers.slice(
        startIdx,
        startIdx + pageSize
      );


    const resultsEl =
      document.getElementById("results");


    if (!pageItems.length) {

      resultsEl.innerHTML =
        '<div class="empty">No papers match your search.</div>';

      renderPagination(
        totalPages
      );

      return;

    }


    /*
     * Build only the visible page.
     */

    resultsEl.innerHTML =
      pageItems
        .map(p => {



          const tagsHtml =
            p.tags.length

              ? `
                <div class="paper-tags">
                  ${p.tags
                    .map(
                      t =>
                        `<span>${highlightMatch(t, rawQuery)}</span>`
                    )
                    .join("")}
                </div>
              `

              : "<span></span>";


          return `

            <div class="paper">

              <p class="paper-ref">
                ${formatIEEE(
                  p,
                  rawQuery
                )}
              </p>

              ${
                p.institutionList.length
                  ? `<p class="paper-institution">${highlightMatch(p.institutionList.join(", "), rawQuery)}</p>`
                  : ""
              }
              

              ${
                p.pdf_url
                  ? (() => {

                      const source =
                        getPaperSource(p);

                      return `
                        <div class="paper-access-row">

                          ${
                            source.label
                              ? `
                                <span class="paper-source">
                                  ${escapeHtml(source.label)}
                                </span>
                              `
                              : "<span></span>"
                          }

                          <a
                            class="paper-access-btn"
                            href="${escapeHtml(p.pdf_url)}"
                            target="_blank"
                            rel="noopener"
                          >
                            Access Paper
                          </a>

                        </div>
                      `;

                    })()
                  : ""
              }


              <div class="paper-footer">

                ${tagsHtml}


                <div class="paper-author-links">

                  ${
                    p.authorList.length
                      ? p.authorList
                          .map(author => `
                            <a
                              href="#"
                              class="paper-author"
                              data-author="${escapeHtml(author)}"
                              title="Show all papers by ${escapeHtml(author)}"
                            >
                              ${escapeHtml(author)}
                            </a>
                          `)
                          .join("")
                      : ""
                  }

                  ${
                    p.doi
                      ? `
                        <a
                          class="paper-doi"
                          href="https://doi.org/${encodeURIComponent(
                            p.doi
                          )}"
                          target="_blank"
                          rel="noopener"
                        >
                          https://doi.org/${escapeHtml(p.doi)}
                        </a>
                      `
                      : ""
                  }

                </div>

              </div>


            </div>

          `;

        })
        .join("");


    resultsEl
      .querySelectorAll(".paper-author")
      .forEach(link => {

        link.addEventListener("click", (event) => {

          event.preventDefault();

          const author =
            link.dataset.author || "";

          if (author) {
            showPapersByAuthor(author);
          }

        });

      });


    renderPagination(
      totalPages
    );

  }

function computeAuthorStats(author) {
  const papersByAuthor = papers.filter(p => p.authorList.includes(author));
  return { count: papersByAuthor.length };
}

function showAuthorProfile(author) {
  const stats = computeAuthorStats(author);

  document.getElementById("authorProfileName").textContent = author;
  document.getElementById("authorProfileCount").textContent =
    `${stats.count} paper${stats.count === 1 ? "" : "s"} in this database`;

  document.getElementById("authorProfile").classList.add("visible");
  visibleAuthorProfile = author;

  positionMarginBoxes();
}


  function hideAuthorProfile() {

    document.getElementById("authorProfile").classList.remove("visible");

    visibleAuthorProfile = null;

  }



    
  /*
   * ---------------------------------------------------------
   * AUTHOR FILTER
   * ---------------------------------------------------------
   *
   * Clicking an author name clears the other filters and
   * shows every paper in this database by that author.
   */

  function showPapersByAuthor(author) {

    selectedAuthors.clear();
    selectedAuthors.add(author);

    selectedInstitutions.clear();

    document.getElementById("search").value = "";
    document.getElementById("authorSearch").value = "";
    document.getElementById("institutionSearch").value = "";

    document.getElementById("yearFrom").value = "";
    document.getElementById("yearTo").value = "";

    document.getElementById("authorChips").innerHTML = `
      <span class="chip">
        ${escapeHtml(author)}
        <button
          type="button"
          data-value="${escapeHtml(author)}"
          aria-label="Remove ${escapeHtml(author)}"
        >
          &times;
        </button>
      </span>
    `;

    document.getElementById("institutionChips").innerHTML = "";

    pushCurrentViewToHistory();

    currentPage = 1;
    lastFilterState = null;

    showAuthorProfile(author);

    render();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  /*
   * ---------------------------------------------------------
   * PAGINATION
   * ---------------------------------------------------------
   */

  function renderPagination(
    totalPages
  ) {

    const el =
      document.getElementById(
        "pagination"
      );


    if (totalPages <= 1) {

      el.innerHTML = "";

      return;

    }


    el.innerHTML = `

      <button
        class="page-btn"
        id="prevPage"
        ${
          currentPage === 1
            ? "disabled"
            : ""
        }
      >
        &larr; Prev
      </button>


      <span class="page-info">
        Page ${currentPage} of ${totalPages}
      </span>


      <button
        class="page-btn"
        id="nextPage"
        ${
          currentPage === totalPages
            ? "disabled"
            : ""
        }
      >
        Next &rarr;
      </button>

    `;


    document
      .getElementById("prevPage")
      .addEventListener(
        "click",
        () => {

          if (
            currentPage > 1
          ) {

            currentPage--;

            pushCurrentViewToHistory();

            /*
             * IMPORTANT:
             *
             * render() is still safe here because
             * filterPapers() sees that the filter state
             * hasn't changed and immediately returns.
             */

            render();

            document
              .querySelector(".wrap")
              .scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

          }

        }
      );


    document
      .getElementById("nextPage")
      .addEventListener(
        "click",
        () => {

          if (
            currentPage <
            totalPages
          ) {

            currentPage++;

            pushCurrentViewToHistory();

            render();

            document
              .querySelector(".wrap")
              .scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

          }

        }
      );

  }


</script>
